  <script type="module">
    import { signIn, signInWithGoogle, getSession, signInWithPhone, verifyPhoneOtp, sendLoginVerificationCode, verifyLoginCode } from './js/auth.js';

    function getAuthRedirectTarget() {
      try {
        const params = new URLSearchParams(window.location.search);
        let target = params.get('redirect') || params.get('return_to') || sessionStorage.getItem('hg_auth_redirect') || '';
        if (target) {
          try { target = decodeURIComponent(target); } catch(e){}
        }
        if (!target || target === 'login.html' || target.includes('login.html') || target.includes('signup.html')) {
          target = 'dashboard.html';
        }
        return target;
      } catch(e) {
        return 'dashboard.html';
      }
    }

    let redirectUrl = getAuthRedirectTarget();

    // Persist redirect target in session for post-login redirect
    try {
      if (redirectUrl && redirectUrl !== 'dashboard.html') {
        sessionStorage.setItem('hg_auth_redirect', redirectUrl);
      }
    } catch (e) {}

    async function initLoginPage() {
      // Forward redirect parameter to signup and forgot password links
      const signupLink = document.querySelector('.auth-footer-text a[href*="signup.html"]');
      if (signupLink && redirectUrl && redirectUrl !== 'dashboard.html') {
        signupLink.href = `signup.html?redirect=${encodeURIComponent(redirectUrl)}`;
      }
      const forgotLink = document.querySelector('.label-row a[href*="forgot-password.html"]');
      if (forgotLink && redirectUrl && redirectUrl !== 'dashboard.html') {
        forgotLink.href = `forgot-password.html?redirect=${encodeURIComponent(redirectUrl)}`;
      }

      // Check if user is already logged in (non-blocking in background)
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const forceStay = urlParams.get('logout') || urlParams.get('reauth') || urlParams.get('force');
        if (!forceStay) {
          const session = await getSession();
          if (session && session.user) {
            try { sessionStorage.removeItem('hg_auth_redirect'); } catch(e){}
            window.location.replace(redirectUrl);
            return;
          }
        }
      } catch (error) {
        console.warn("Notice checking session:", error);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLoginPage, { once: true });
    } else {
      initLoginPage();
    }

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('auth-error');
    const loginBtn = document.getElementById('login-btn');
    const spinner = document.getElementById('login-spinner');
    const googleBtn = document.getElementById('google-login-btn');
    const toggleMethodBtn = document.getElementById('toggle-method-btn');

    // UI Groups
    const emailGroup = document.getElementById('email-group');
    const phoneGroup = document.getElementById('phone-group');
    const passwordGroup = document.getElementById('password-group');
    const otpGroup = document.getElementById('otp-group');
    
    // Inputs
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const otpInput = document.getElementById('otp');

    // State
    let loginMethod = 'email'; // 'email' | 'verify_email' | 'phone' | 'verify'
    let pendingPhone = '';
    let pendingEmail = '';
    let pendingPassword = '';
    let pendingEmailToken = '';

    toggleMethodBtn.addEventListener('click', () => {
      errorDiv.style.display = 'none';
      if (loginMethod === 'verify_email') {
        // Back to email entry
        loginMethod = 'email';
        otpGroup.style.display = 'none';
        emailGroup.style.display = 'block';
        passwordGroup.style.display = 'block';
        loginBtn.querySelector('span').textContent = 'Log In';
        toggleMethodBtn.textContent = 'Sign in with Phone (OTP) instead';
      } else if (loginMethod === 'email') {
        // Switch to phone
        loginMethod = 'phone';
        emailGroup.style.display = 'none';
        passwordGroup.style.display = 'none';
        phoneGroup.style.display = 'block';
        toggleMethodBtn.textContent = 'Sign in with Email instead';
        loginBtn.querySelector('span').textContent = 'Send OTP';
      } else {
        // Switch back to email
        loginMethod = 'email';
        phoneGroup.style.display = 'none';
        otpGroup.style.display = 'none';
        emailGroup.style.display = 'block';
        passwordGroup.style.display = 'block';
        toggleMethodBtn.textContent = 'Sign in with Phone (OTP) instead';
        loginBtn.querySelector('span').textContent = 'Log In';
        pendingPhone = '';
      }
    });

    googleBtn.addEventListener('click', async () => {
      try {
        errorDiv.style.display = 'none';
        googleBtn.disabled = true;
        googleBtn.style.opacity = '0.7';
        redirectUrl = getAuthRedirectTarget();
        if (redirectUrl) {
          try {
            sessionStorage.setItem('hg_auth_redirect', redirectUrl);
            const hostname = window.location.hostname;
            let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
            const secureStr = window.location.protocol === 'https:' ? '; secure' : '';
            document.cookie = `hg_auth_redirect=${encodeURIComponent(redirectUrl)}; path=/; max-age=3600${domainStr}; SameSite=Lax${secureStr}`;
          } catch(e){}
        }
        await signInWithGoogle();
      } catch (err) {
        errorDiv.textContent = 'Google sign-in failed: ' + err.message;
        errorDiv.style.display = 'block';
        googleBtn.disabled = false;
        googleBtn.style.opacity = '1';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      loginBtn.disabled = true;
      spinner.style.display = 'block';
      loginBtn.querySelector('span').style.display = 'none';
      redirectUrl = getAuthRedirectTarget();
      
      try {
        if (loginMethod === 'email') {
          // Send 6-digit Login Verification Code to user email from info@webguruji.online
          const email = (emailInput.value || '').trim();
          const password = passwordInput.value;
          if (!email || !password) throw new Error("Email and password required.");

          const res = await sendLoginVerificationCode(email, password, 'main');
          pendingEmail = email;
          pendingPassword = password;
          pendingEmailToken = res.token;
          loginMethod = 'verify_email';

          // Switch UI to Email OTP Verification mode
          emailGroup.style.display = 'none';
          passwordGroup.style.display = 'none';
          otpGroup.style.display = 'block';
          const otpLabel = otpGroup.querySelector('label');
          if (otpLabel) {
            otpLabel.innerHTML = 'Enter 6-digit code sent from <span style="color:#38bdf8;">info@webguruji.online</span> to ' + email;
          }
          otpInput.value = '';
          otpInput.focus();
          loginBtn.querySelector('span').textContent = 'Verify Code & Log In';
          toggleMethodBtn.textContent = '← Back to Email / Password';

          errorDiv.style.color = '#10b981';
          errorDiv.style.borderColor = '#10b981';
          errorDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
          errorDiv.textContent = 'Verification code sent to ' + email + ' from info@webguruji.online! Please check your inbox or spam.';
          errorDiv.style.display = 'block';

        } else if (loginMethod === 'verify_email') {
          // Verify Email OTP and complete login
          const otp = (otpInput.value || '').trim();
          if (!otp) throw new Error("Verification code is required.");

          const verifyRes = await verifyLoginCode(pendingEmail, otp, pendingEmailToken, 'main');
          await signIn(pendingEmail, pendingPassword);

          if (verifyRes.isNewUser) {
            sessionStorage.setItem('hg_pending_greeting', JSON.stringify({
              type: 'new',
              name: verifyRes.displayName || 'User',
              email: pendingEmail
            }));
          } else {
            sessionStorage.setItem('hg_pending_greeting', JSON.stringify({
              type: 'returning',
              name: verifyRes.displayName || 'User'
            }));
          }

          try {
            sessionStorage.removeItem('hg_auth_redirect');
            const hostname = window.location.hostname;
            let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
            document.cookie = `hg_auth_redirect=; path=/; max-age=0${domainStr}; SameSite=Lax`;
          } catch(e){}
          window.location.replace(redirectUrl);

        } else if (loginMethod === 'phone') {
          // Send Phone OTP
          const phone = (phoneInput.value || '').trim();
          if(!phone) throw new Error("Phone number required.");
          
          await signInWithPhone(phone);
          pendingPhone = phone;
          loginMethod = 'verify';
          
          // Switch UI to Verify mode
          phoneGroup.style.display = 'none';
          otpGroup.style.display = 'block';
          loginBtn.querySelector('span').textContent = 'Verify OTP';
          toggleMethodBtn.textContent = 'Change Phone Number';
          
          errorDiv.style.color = '#10b981';
          errorDiv.style.borderColor = '#10b981';
          errorDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
          errorDiv.textContent = 'OTP sent successfully! Please check your messages.';
          errorDiv.style.display = 'block';
          
        } else if (loginMethod === 'verify') {
          // Verify Phone OTP
          const otp = (otpInput.value || '').trim();
          if(!otp) throw new Error("OTP required.");
          
          await verifyPhoneOtp(pendingPhone, otp);
          try {
            sessionStorage.removeItem('hg_auth_redirect');
            const hostname = window.location.hostname;
            let domainStr = (hostname === 'webguruji.online' || hostname.endsWith('.webguruji.online')) ? '; domain=.webguruji.online' : '';
            document.cookie = `hg_auth_redirect=; path=/; max-age=0${domainStr}; SameSite=Lax`;
          } catch(e){}
          window.location.replace(redirectUrl);
        }
      } catch (err) {
        // Reset Error styles to default red
        errorDiv.style.color = 'var(--error-color, #ef4444)';
        errorDiv.style.borderColor = 'var(--error-color, #ef4444)';
        errorDiv.style.backgroundColor = 'rgba(255, 71, 87, 0.1)';
        errorDiv.textContent = err.message || 'Authentication failed. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        spinner.style.display = 'none';
        loginBtn.querySelector('span').style.display = 'block';
      }
    });
  </script>

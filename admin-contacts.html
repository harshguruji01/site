<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Admin Contacts & Feedback Management – HarshGuruJi</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #ec4899;
      --bg-dark: #090d16;
      --bg-panel: rgba(17, 24, 39, 0.85);
      --bg-glass: rgba(255, 255, 255, 0.04);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.45);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* Header Bar */
    .admin-nav {
      background: rgba(13, 19, 33, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #fff;
    }
    .admin-brand img { width: 34px; height: 34px; border-radius: 8px; }
    .admin-brand h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; margin: 0; }
    .admin-brand span { font-size: 0.75rem; color: var(--text-muted); display: block; }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-site-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.2s;
    }
    .btn-site-link:hover { color: #fff; }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.25); }

    /* Layout Container */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* Login Gate */
    #login-gate {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      padding: 3rem 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
      max-width: 440px;
      margin: 5rem auto;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
    }
    #login-gate h2 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
    }
    #login-gate p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    #login-gate input {
      width: 100%;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    #login-gate input:focus { border-color: var(--primary); }
    #login-gate button {
      width: 100%;
      padding: 0.9rem;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    #login-gate button:hover { background: var(--primary-hover); }

    /* Dashboard Layout */
    #dashboard { display: none; }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; color: #fff; }

    /* Controls Bar (Filter + Search) */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .filter-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab.active {
      background: var(--primary);
      color: #fff;
    }
    .search-input-box {
      position: relative;
      flex: 1;
      max-width: 320px;
    }
    .search-input-box input {
      width: 100%;
      padding: 0.55rem 1rem 0.55rem 2.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .search-input-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Message Cards */
    .message-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }
    .message-card:hover {
      border-color: var(--border-focus);
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .sender-info h3 {
      margin: 0 0 4px 0;
      font-size: 1.15rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge-verified {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--success);
      background: rgba(16, 185, 129, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .sender-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .sender-meta span { display: flex; align-items: center; gap: 4px; }
    .status-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .status-replied { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }

    /* Message Content Box */
    .user-msg-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1.25rem;
    }

    /* Admin Reply Preview Box */
    .admin-reply-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .reply-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 0.5rem;
    }
    .reply-text {
      color: #f8fafc;
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0;
      white-space: pre-wrap;
    }
    .user-read-indicator {
      font-size: 0.78rem;
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Compose Reply Area */
    .reply-composer {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .reply-composer label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }
    .reply-composer textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.92rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }
    .reply-composer textarea:focus { border-color: var(--primary); }

    .quick-replies {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0.5rem 0 0.85rem;
    }
    .quick-reply-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.76rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-reply-pill:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .btn-send-reply {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.55rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-send-reply:hover { background: var(--primary-hover); }

    .btn-delete {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.25); }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }

    /* Toast Notification */
    #admin-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-left: 4px solid var(--primary);
      z-index: 9999;
      font-size: 0.9rem;
      display: none;
    }
  </style>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7706204118195419"
     crossorigin="anonymous"></script>
</head>
<body>

  <header class="admin-nav">
    <a href="index.html" class="admin-brand">
      <img src="logo.png" alt="HarshGuruJi Logo">
      <div>
        <h2>HarshGuruJi Admin</h2>
        <span>Contacts &amp; User Feedback Management</span>
      </div>
    </a>
    <div class="admin-actions">
      <a href="adminapkupload.html" class="btn-site-link">📦 Store Admin</a>
      <a href="index.html" class="btn-site-link">Home ↗</a>
      <button type="button" class="btn-logout" id="btn-admin-logout" style="display:none;" onclick="logoutAdmin()">Lock Dashboard</button>
    </div>
  </header>

  <div class="container">
    <!-- Login Gate -->
    <div id="login-gate">
      <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🔐</div>
      <h2>Admin Authentication</h2>
      <p>Authorized administrator access only. Enter administrative key to unlock.</p>
      <input type="password" id="admin-pwd" placeholder="Enter Admin Password" autocomplete="current-password">
      <button type="button" id="btn-unlock" onclick="checkAdmin()">Unlock Dashboard</button>
      <p id="login-err" style="color:var(--danger); display:none; margin-top:1rem; font-size:0.9rem;">❌ Incorrect administrative key.</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
      <!-- Top Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Total Messages</span>
          <span class="stat-val" id="stat-total">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Pending / Unanswered</span>
          <span class="stat-val" id="stat-pending" style="color: var(--warning);">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Replied by Admin</span>
          <span class="stat-val" id="stat-replied" style="color: var(--success);">0</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <div class="filter-tabs">
          <button type="button" class="filter-tab active" data-filter="all" onclick="setFilter('all')">All Messages</button>
          <button type="button" class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Pending</button>
          <button type="button" class="filter-tab" data-filter="replied" onclick="setFilter('replied')">Replied</button>
        </div>

        <div class="search-input-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
          <input type="text" id="admin-search-input" placeholder="Search by name, email, message..." oninput="handleSearch(this.value)">
        </div>
      </div>

      <!-- Messages List -->
      <div id="requests-list">
        <!-- Injected dynamically by JS -->
      </div>
    </div>
  </div>

  <div id="admin-toast"></div>

  <!-- Supabase Import -->
  <script type="module">
    import { supabase } from './js/supabase.js';
    window._supabase = supabase;

    // Check if user is already signed in with harshguruji01@gmail.com
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user && session.user.email === 'harshguruji01@gmail.com') {
          unlockDashboard();
          return;
        }
      } catch(err) {
        console.warn("Session check error:", err);
      }

      // Check cached session
      if (sessionStorage.getItem('admin_contacts_auth') === 'true') {
        unlockDashboard();
      }
    });
  </script>

  <script>
    const ADMIN_PASS = 'harshguruji01@gmail.com';
    let allMessages = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // Allow Enter key in password field
    document.getElementById('admin-pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAdmin();
    });

    function checkAdmin() {
      const pwd = document.getElementById('admin-pwd').value.trim();
      if (pwd === ADMIN_PASS) {
        sessionStorage.setItem('admin_contacts_auth', 'true');
        unlockDashboard();
      } else {
        const errEl = document.getElementById('login-err');
        errEl.style.display = 'block';
        setTimeout(() => errEl.style.display = 'none', 3500);
      }
    }

    function unlockDashboard() {
      document.getElementById('login-gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('btn-admin-logout').style.display = 'inline-block';
      loadRequests();
    }

    function logoutAdmin() {
      sessionStorage.removeItem('admin_contacts_auth');
      window.location.reload();
    }

    async function loadRequests() {
      const list = document.getElementById('requests-list');
      list.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:2rem;">Loading messages from database...</p>';

      try {
        // Auto-purge messages older than 14 days (2 weeks maximum)
        try {
          const fourteenDaysAgo = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString();
          await window._supabase
            .from('contact_messages')
            .delete()
            .lt('created_at', fourteenDaysAgo);
        } catch (purgeErr) {
          console.warn("Auto-purge notice:", purgeErr);
        }

        const { data, error } = await window._supabase
          .from('contact_messages')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allMessages = data || [];
        updateStats();
        renderFilteredMessages();

      } catch(err) {
        list.innerHTML = `<p style="color:var(--danger); text-align:center; padding:2rem;">Error loading messages: ${err.message}</p>`;
      }
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allMessages.length;
      const pendingCount = allMessages.filter(m => !m.admin_reply || m.status === 'Pending').length;
      const repliedCount = allMessages.filter(m => !!m.admin_reply || m.status === 'Replied').length;
      document.getElementById('stat-pending').textContent = pendingCount;
      document.getElementById('stat-replied').textContent = repliedCount;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(tab => {
        if (tab.dataset.filter === filter) tab.classList.add('active');
        else tab.classList.remove('active');
      });
      renderFilteredMessages();
    }

    function handleSearch(val) {
      searchQuery = (val || '').toLowerCase().trim();
      renderFilteredMessages();
    }

    function renderFilteredMessages() {
      const list = document.getElementById('requests-list');
      
      const filtered = allMessages.filter(msg => {
        // Tab filter
        const isReplied = !!msg.admin_reply || msg.status === 'Replied';
        if (currentFilter === 'pending' && isReplied) return false;
        if (currentFilter === 'replied' && !isReplied) return false;

        // Search filter
        if (searchQuery) {
          const matchName = (msg.name || '').toLowerCase().includes(searchQuery);
          const matchEmail = (msg.email || '').toLowerCase().includes(searchQuery);
          const matchMsg = (msg.message || '').toLowerCase().includes(searchQuery);
          const matchReply = (msg.admin_reply || '').toLowerCase().includes(searchQuery);
          if (!matchName && !matchEmail && !matchMsg && !matchReply) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>No Messages Found</h3>
            <p>No user messages or feedback found matching your criteria.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(req => {
        const isReplied = !!req.admin_reply || req.status === 'Replied';
        const statusClass = isReplied ? 'status-replied' : 'status-pending';
        const statusText = isReplied ? 'Replied' : 'Pending Review';

        let replyHtml = '';
        if (req.admin_reply) {
          const readBadge = req.user_read 
            ? '<span style="color:#10b981;">✓ Opened by user</span>' 
            : '<span style="color:#f59e0b;">⏳ Unread by user (Notification sent)</span>';

          replyHtml = `
            <div class="admin-reply-box">
              <div class="reply-header">
                <span>💬 Sent by ${req.replied_by || 'Admin'} • ${req.replied_at ? new Date(req.replied_at).toLocaleString() : 'Recently'}</span>
                <span>${readBadge}</span>
              </div>
              <p class="reply-text">${escapeHtml(req.admin_reply)}</p>
            </div>
          `;
        }

        const dateStr = req.created_at ? new Date(req.created_at).toLocaleString() : 'Unknown date';

        return `
          <div class="message-card" id="req-${req.id}">
            <div class="card-top">
              <div class="sender-info">
                <h3>
                  ${escapeHtml(req.name)}
                  ${req.user_id ? `<span class="badge-verified">✓ Logged-in User</span>` : ''}
                </h3>
                <div class="sender-meta">
                  <span>✉️ <a href="mailto:${encodeURIComponent(req.email)}" style="color:var(--text-muted); text-decoration:none;">${escapeHtml(req.email)}</a></span>
                  ${req.phone ? `<span>📞 ${escapeHtml(req.phone)}</span>` : ''}
                  ${req.gender ? `<span>⚧ ${escapeHtml(req.gender)}</span>` : ''}
                  <span>📅 ${dateStr}</span>
                </div>
              </div>
              <span class="status-badge ${statusClass}">${statusText}</span>
            </div>

            <!-- User's Sent Message -->
            <div class="user-msg-box">
              <strong>User Feedback / Message:</strong><br>
              ${escapeHtml(req.message)}
            </div>

            <!-- Previous Admin Reply (if any) -->
            ${replyHtml}

            <!-- Compose Reply Section -->
            <div class="reply-composer">
              <label for="reply-text-${req.id}">
                ${req.admin_reply ? '✏️ Send an Updated Reply to User:' : '💬 Send Message / Reply to User (Appears in User’s Navbar Bell 🔔):'}
              </label>
              <textarea id="reply-text-${req.id}" placeholder="Type your response to ${escapeHtml(req.name)}..."></textarea>
              
              <div class="quick-replies">
                <span class="quick-reply-pill" onclick="setQuickReply('${req.id}', 'Thank you for your feedback! We have noted this and are working on an improvement.')">💡 General Thanks</span>
                <span class="quick-reply-pill" onclick="setQuickReply('${req.id}', 'Thank you for reporting this issue! Our engineering team has resolved the problem. Please refresh and try again.')">🛠️ Bug Resolved</span>
                <span class="quick-reply-pill" onclick="setQuickReply('${req.id}', 'Hi, thanks for reaching out! We are currently investigating this and will keep you updated.')">⏳ Under Investigation</span>
                <span class="quick-reply-pill" onclick="setQuickReply('${req.id}', 'Great suggestion! We have added this request to our upcoming roadmap.')">🚀 Added to Roadmap</span>
              </div>

              <div class="card-actions">
                <button type="button" class="btn-send-reply" onclick="sendReply('${req.id}')">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                  Send Reply to User
                </button>
                <button type="button" class="btn-delete" onclick="deleteReq('${req.id}')">Delete Message</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setQuickReply(id, text) {
      const textarea = document.getElementById(`reply-text-${id}`);
      if (textarea) {
        textarea.value = text;
        textarea.focus();
      }
    }

    window.sendReply = async function(id) {
      const textarea = document.getElementById(`reply-text-${id}`);
      const replyText = textarea ? textarea.value.trim() : '';

      if (!replyText) {
        alert("Please type a reply message before sending.");
        return;
      }

      try {
        const now = new Date().toISOString();
        const { error } = await window._supabase
          .from('contact_messages')
          .update({
            admin_reply: replyText,
            replied_at: now,
            replied_by: 'HarshGuruJi (Admin)',
            status: 'Replied',
            user_read: false,
            updated_at: now
          })
          .eq('id', id);

        if (error) throw error;

        // Update local state
        const target = allMessages.find(m => m.id === id);
        if (target) {
          target.admin_reply = replyText;
          target.replied_at = now;
          target.replied_by = 'HarshGuruJi (Admin)';
          target.status = 'Replied';
          target.user_read = false;
        }

        showToast("✅ Reply sent! The user will see this in their Navbar Notification bell.");
        updateStats();
        renderFilteredMessages();

      } catch(err) {
        alert("Failed to send reply: " + err.message);
      }
    };

    window.deleteReq = async function(id) {
      if (!confirm("Are you sure you want to delete this message?")) return;
      try {
        const { error } = await window._supabase
          .from('contact_messages')
          .delete()
          .eq('id', id);

        if (error) throw error;

        allMessages = allMessages.filter(m => m.id !== id);
        showToast("🗑️ Message deleted successfully.");
        updateStats();
        renderFilteredMessages();

      } catch(err) {
        alert("Error deleting message: " + err.message);
      }
    };

    function showToast(msg) {
      const toast = document.getElementById('admin-toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>

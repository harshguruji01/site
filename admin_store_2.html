<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 2: Description | Store Wizard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 2rem 0; }
    .card { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; width: 100%; max-width: 500px; }
    h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; text-align: center; }
    p { color: #94a3b8; margin-bottom: 2rem; text-align: center; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #ff3366; }
    
    .btn { padding: 1rem 2rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff3366, #7c3aed); color: white; font-weight: 700; cursor: pointer; width: 100%; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .steps { margin-bottom: 2rem; display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
    .step.active { color: #ff3366; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="steps">
      <span class="step">1. Upload</span>
      <span class="step active">2. Info</span>
      <span class="step">3. Logo</span>
      <span class="step">4. Publish</span>
    </div>
    
    <h1>Basic Info</h1>
    <p>Provide the application details.</p>
    
    <form id="step2-form">
      <div class="form-group">
        <label>URL Slug (e.g. pubg-mobile)</label>
        <input type="text" id="slug" required pattern="^[a-z0-9-]+$">
      </div>
      <div class="form-group">
        <label>App Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Developer</label>
        <input type="text" id="dev" required>
      </div>
      <div class="form-group">
        <label>Platform</label>
        <select id="os">
          <option value="Android">Android</option>
          <option value="Windows">Windows</option>
          <option value="macOS">macOS</option>
          <option value="Linux">Linux</option>
        </select>
      </div>
      <div class="form-group">
        <label>Short Description</label>
        <textarea id="desc" rows="3" required></textarea>
      </div>
      
      <button type="submit" class="btn">Next Step →</button>
    </form>
  </div>

  <script>
    if(!sessionStorage.getItem('wizard_apk_url')) {
      alert('Please upload an APK first.');
      window.location.href = 'admin_store_1.html';
    }

    document.getElementById('step2-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('wizard_slug', document.getElementById('slug').value);
      sessionStorage.setItem('wizard_name', document.getElementById('name').value);
      sessionStorage.setItem('wizard_dev', document.getElementById('dev').value);
      sessionStorage.setItem('wizard_os', document.getElementById('os').value);
      sessionStorage.setItem('wizard_desc', document.getElementById('desc').value);
      
      window.location.href = 'admin_store_3.html';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | HarshGuruJi</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f172a;
      --color-surface: rgba(30, 41, 59, 0.7);
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-main: #f8fafc;
      --color-primary: #ff3366;
      --font-sans: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body { background: var(--color-bg); color: var(--color-text-main); min-height: 100vh; padding: 2rem; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem; }
    .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .stat-card { background: var(--color-surface); border: 1px solid var(--color-border); padding: 1.5rem; border-radius: 16px; text-align: center; }
    .stat-card h3 { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.5rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--color-primary); font-family: 'Space Grotesk', sans-serif;}

    .users-table-wrapper { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--color-border); }
    th { font-size: 0.85rem; text-transform: uppercase; color: #94a3b8; background: rgba(255,255,255,0.02); }
    
    .badge { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .badge-suspended { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .badge-banned { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

    .btn { padding: 0.4rem 0.8rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-right: 0.5rem;}
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .btn-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .btn-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }

    a { color: var(--color-primary); text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Admin Dashboard</h1>
      <a href="profile.html">Back to Profile</a>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h3>Active Users</h3><div class="value" id="stat-active">0</div></div>
      <div class="stat-card"><h3>Suspended</h3><div class="value" id="stat-suspended" style="color:#f59e0b;">0</div></div>
      <div class="stat-card"><h3>Banned</h3><div class="value" id="stat-banned" style="color:#ef4444;">0</div></div>
    </div>

    <div class="users-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchUsers() {
      try {
        const res = await fetch('backend/admin/users.php');
        if (res.status === 401 || res.status === 403) {
          alert('Access Denied. Admins only.');
          window.location.href = 'profile.html';
          return;
        }
        
        const data = await res.json();
        if (data.status === 'success') {
          // Update Stats
          const stats = data.data.stats;
          document.getElementById('stat-active').textContent = stats['Active'] || 0;
          document.getElementById('stat-suspended').textContent = stats['Suspended'] || 0;
          document.getElementById('stat-banned').textContent = stats['Banned'] || 0;

          // Update Table
          const tbody = document.getElementById('users-tbody');
          tbody.innerHTML = '';
          
          data.data.users.forEach(user => {
            const tr = document.createElement('tr');
            
            let badgeClass = 'badge-active';
            if(user.status === 'Suspended') badgeClass = 'badge-suspended';
            if(user.status === 'Banned') badgeClass = 'badge-banned';

            let actions = '';
            if (user.status !== 'Active') {
               actions += `<button class="btn btn-success" onclick="userAction(${user.id}, 'activate')">Activate</button>`;
            } else {
               actions += `<button class="btn btn-warning" onclick="userAction(${user.id}, 'suspend')">Suspend</button>`;
            }
            actions += `<button class="btn btn-danger" onclick="userAction(${user.id}, 'ban')">Ban</button>`;

            tr.innerHTML = `
              <td><strong>@${user.username}</strong></td>
              <td>${user.email}</td>
              <td>${user.role}</td>
              <td><span class="badge ${badgeClass}">${user.status}</span></td>
              <td>${new Date(user.registration_date).toLocaleDateString()}</td>
              <td>${actions}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function userAction(userId, action) {
      if(!confirm(`Are you sure you want to ${action} this user?`)) return;
      
      const formData = new FormData();
      formData.append('user_id', userId);
      formData.append('action', action);

      try {
        const res = await fetch('backend/admin/actions.php', { method: 'POST', body: formData });
        const data = await res.json();
        alert(data.message);
        if(data.status === 'success') fetchUsers();
      } catch (err) {
        alert('Error performing action.');
      }
    }

    fetchUsers();
  </script>
</body>
</html>

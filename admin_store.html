<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Store | HarshGuruJi Admin</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f172a; --color-surface: rgba(30, 41, 59, 0.7);
      --color-border: rgba(255, 255, 255, 0.1); --color-text-main: #f8fafc;
      --color-primary: #ff3366; --color-secondary: #7c3aed;
      --font-sans: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body { background: var(--color-bg); color: var(--color-text-main); padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; background: var(--color-surface); backdrop-filter: blur(20px); border: 1px solid var(--color-border); border-radius: 20px; padding: 2rem; }
    h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 2rem; text-align: center; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--color-border); background: rgba(0,0,0,0.2); color: white; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--color-primary); }
    
    .btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); color: white; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    
    .nav-links { margin-bottom: 2rem; display: flex; justify-content: space-between; }
    a { color: var(--color-primary); text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-links">
      <a href="admin.html">← Back to Admin</a>
      <a href="store.html" target="_blank">View Live Store →</a>
    </div>
    
    <h1>Store Management</h1>
    
    <div style="text-align: center; margin-top: 3rem; margin-bottom: 3rem;">
      <p style="color: #94a3b8; margin-bottom: 1.5rem;">Use the new multi-step wizard to upload APKs, add descriptions, icons, and publish directly to the live store.</p>
      <a href="admin_store_1.html" class="btn" style="display: inline-block; width: auto; padding: 1rem 3rem;">+ Start Publishing Wizard</a>
    </div>
  </div>
</body>
</html>

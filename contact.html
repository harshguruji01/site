<!-- Mobile Full Screen Menu -->
<div id="scroll-progress"></div><canvas id="particleCanvas"></canvas><div class="auth-page"><div class="auth-container"><div class="auth-card" style="max-width:600px"><div class="auth-header"><div class="badge" style="margin:0 auto 1rem">Get In Touch</div><h2 class="section-title" style="font-size:2.5rem">Contact <span class="gradient-text">Us</span></h2><p style="color:var(--text-secondary)">Have a question or feedback? We'd love to hear from you!</p></div>
<form class="auth-form" id="contact-form">
  <div class="input-group"><label>Name *</label><div class="input-wrapper"><span class="input-icon">👤</span> <input type="text" id="contact-name" placeholder="Your Name" required=""></div></div>
  <div class="input-group"><label>Email Address *</label><div class="input-wrapper"><span class="input-icon">✉️</span> <input type="email" id="contact-email" placeholder="you@example.com" required=""></div></div>
  <div class="input-group"><label>Phone Number (Optional)</label><div class="input-wrapper"><span class="input-icon">📞</span> <input type="tel" id="contact-phone" placeholder="Your Phone Number"></div></div>
  <div class="input-group"><label>Gender *</label>
    <div class="input-wrapper" style="position:relative;">
      <span class="input-icon" style="z-index: 10;">⚧</span>
      <select id="contact-gender" required style="width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:20px;padding:1rem 1.5rem 1rem 45px;color:#fff;outline:0;transition:.3s;font-family:Inter,sans-serif;appearance:none;cursor:pointer;">
        <option value="" disabled selected style="background:#111118;color:#a0a0a0;">Select your gender</option>
        <option value="Male" style="background:#111118;">Male</option>
        <option value="Female" style="background:#111118;">Female</option>
        <option value="Other" style="background:#111118;">Other</option>
      </select>
      <span style="position:absolute; right:1.5rem; top:50%; transform:translateY(-50%); pointer-events:none; color:#a0a0a0;">▼</span>
    </div>
  </div>
  <div class="input-group"><label>Description * (Bugs, problems, feedback - under 1000 words)</label><div class="input-wrapper"><span class="input-icon" style="top:15px">📝</span> <textarea id="contact-description" placeholder="Describe your issue or feedback in detail..." rows="5" style="width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:20px;padding:1rem 1.5rem 1rem 45px;color:#fff;outline:0;transition:.3s;font-family:Inter,sans-serif;resize:vertical" required=""></textarea></div></div>
  <button id="btn-contact-submit" type="submit" class="btn btn-primary auth-submit" style="width:100%;padding:1rem">Send Request</button>
</form>
</div></div></div>
<script type="module">
  import { supabase } from './js/supabase.js';

  document.getElementById('contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-contact-submit');
    const name = document.getElementById('contact-name').value.trim();
    const email = document.getElementById('contact-email').value.trim();
    const phone = document.getElementById('contact-phone').value.trim();
    const gender = document.getElementById('contact-gender').value;
    const description = document.getElementById('contact-description').value.trim();
    
    // Check word count for description
    const wordCount = description.split(/\s+/).filter(word => word.length > 0).length;
    if (wordCount > 1000) {
      alert("Description cannot exceed 1000 words. You currently have " + wordCount + " words.");
      return;
    }

    if(!name || !email || !gender || !description) {
      alert("Please fill all required fields.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Sending...";

    try {
      const { error } = await supabase
        .from('contact_messages')
        .insert([{ 
          name, 
          email, 
          phone: phone || null, 
          gender, 
          message: description, // Storing description in the 'message' column for backward compatibility 
          created_at: new Date().toISOString() 
        }]);
        
      if(error) throw error;
      
      alert("Request sent successfully! We will get back to you shortly.");
      document.getElementById('contact-form').reset();
    } catch(err) {
      console.error(err);
      alert("An error occurred: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Send Request";
    }
  });
</script>

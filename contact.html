<!-- Mobile Full Screen Menu -->
<div id="scroll-progress"></div><canvas id="particleCanvas"></canvas><div class="auth-page"><div class="auth-container"><div class="auth-card" style="max-width:600px"><div class="auth-header"><div class="badge" style="margin:0 auto 1rem">Get In Touch</div><h2 class="section-title" style="font-size:2.5rem">Contact <span class="gradient-text">Us</span></h2><p style="color:var(--text-secondary)">Have a question or feedback? We'd love to hear from you!</p></div><form class="auth-form" id="contact-form"><div class="input-group"><label>Name</label><div class="input-wrapper"><span class="input-icon">👤</span> <input type="text" id="contact-name" placeholder="Your Name" required=""></div></div><div class="input-group"><label>Email Address</label><div class="input-wrapper"><span class="input-icon">✉️</span> <input type="email" id="contact-email" placeholder="you@example.com" required=""></div></div><div class="input-group"><label>Message</label><div class="input-wrapper"><span class="input-icon" style="top:15px">💬</span> <textarea id="contact-message" placeholder="How can we help?" rows="4" style="width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:20px;padding:1rem 1.5rem 1rem 45px;color:#fff;outline:0;transition:.3s;font-family:Inter,sans-serif;resize:vertical" required=""></textarea></div></div><button id="btn-contact-submit" type="submit" class="btn btn-primary auth-submit" style="width:100%;padding:1rem">Send Message</button></form></div></div></div>
<script>
  document.getElementById('contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-contact-submit');
    const name = document.getElementById('contact-name').value.trim();
    const email = document.getElementById('contact-email').value.trim();
    const message = document.getElementById('contact-message').value.trim();
    
    if(!name || !email || !message) return alert("Please fill all fields.");

    btn.disabled = true;
    btn.innerText = "Sending...";

    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, message })
      });
      const data = await res.json();
      if(res.ok && data.success) {
        alert("Message sent successfully! We will get back to you shortly.");
        document.getElementById('contact-form').reset();
      } else {
        alert(data.message || "Failed to send message. Please try again.");
      }
    } catch(err) {
      console.error(err);
      alert("An error occurred. Please try again later.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Send Message";
    }
  });
</script>

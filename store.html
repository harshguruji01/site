<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store | HarshGuruJi Premium</title>
  <meta name="description" content="Discover, download, and update premium software, games, and mods.">
  <link rel="icon" type="image/png" href="logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-bg: #0f172a;
      --color-surface: rgba(30, 41, 59, 0.6);
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-primary: #ff3366;
      --color-secondary: #7c3aed;
      --font-sans: 'Inter', sans-serif;
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body { background: var(--color-bg); color: var(--color-text-main); min-height: 100vh; overflow-x: hidden; }

    /* Animated Orbs */
    .bg-orbs { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(100px); animation: float 25s infinite alternate; }
    .orb-1 { width: 50vw; height: 50vw; top: -10%; left: -10%; background: rgba(124, 58, 237, 0.15); }
    .orb-2 { width: 60vw; height: 60vw; bottom: -20%; right: -10%; background: rgba(255, 51, 102, 0.15); animation-delay: -5s; }

    @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(10%, 15%); } }

    /* Hero Section */
    .store-hero {
      padding: 6rem 2rem 4rem;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .store-hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .store-hero p { color: var(--color-text-muted); font-size: 1.1rem; margin-bottom: 2rem; }

    .search-bar {
      display: flex;
      background: var(--color-surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: 100px;
      padding: 0.5rem;
      box-shadow: var(--shadow-glass);
      transition: all 0.3s;
    }
    .search-bar:focus-within { border-color: var(--color-primary); box-shadow: 0 0 0 4px rgba(255, 51, 102, 0.2); }
    .search-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: white; padding: 1rem 1.5rem; font-size: 1rem;
    }
    .search-btn {
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      border: none; border-radius: 100px; padding: 0 2rem; color: white;
      font-weight: 600; cursor: pointer; transition: transform 0.2s;
    }
    .search-btn:hover { transform: scale(1.05); }

    /* Filters Navigation */
    .store-filters {
      display: flex; gap: 1rem; justify-content: center; padding: 0 2rem 2rem; flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--color-surface); backdrop-filter: blur(10px);
      border: 1px solid var(--color-border); color: var(--color-text-main);
      padding: 0.8rem 1.5rem; border-radius: 100px; cursor: pointer; font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(255, 51, 102, 0.1); border-color: var(--color-primary); color: var(--color-primary);
    }

    /* Grid Layout */
    .store-container {
      max-width: 1400px; margin: 0 auto; padding: 0 2rem 4rem;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 600px) {
      .store-hero { padding: 4rem 1rem 2rem; }
      .store-hero h1 { font-size: 2.2rem; }
      .store-container { padding: 0 1rem 3rem; }
      .app-grid { grid-template-columns: 1fr; }
      .search-btn { padding: 0 1rem; }
      .store-filters { padding: 0 1rem 1.5rem; }
    }

    /* App Card (Ninite Style Utility + AN1 Richness) */
    .app-card {
      background: var(--color-surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .app-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 51, 102, 0.3);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    
    .card-header { display: flex; gap: 1rem; align-items: center; }
    .app-icon { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; background: #1e293b; padding: 4px; }
    .app-title-group { flex: 1; }
    .app-title { font-size: 1.1rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.2rem; }
    .app-dev { font-size: 0.8rem; color: var(--color-primary); }
    
    .card-body { font-size: 0.9rem; color: var(--color-text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--color-border); font-size: 0.8rem; color: #94a3b8; }
    .badge-os { background: rgba(255,255,255,0.1); padding: 0.2rem 0.6rem; border-radius: 12px; }
    
    .download-action { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .version-tag { font-family: monospace; background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 0.2rem 0.5rem; border-radius: 4px; }
    
    #loading-state { text-align: center; padding: 4rem; color: var(--color-text-muted); grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <section class="store-hero">
    <h1>HarshGuruJi Store</h1>
    <p>Discover trusted software, premium games, and essential utilities for Windows & Android.</p>
    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search apps, games, developers...">
      <button class="search-btn" onclick="fetchApps()">Search</button>
    </div>
  </section>

  <nav class="store-filters">
    <button class="filter-btn active" onclick="setFilter('')">All</button>
    <button class="filter-btn" onclick="setFilter('Windows')">Windows</button>
    <button class="filter-btn" onclick="setFilter('Android')">Android</button>
    <button class="filter-btn" onclick="setFilter('macOS')">macOS</button>
    <button class="filter-btn" onclick="setFilter('Linux')">Linux</button>
  </nav>

  <main class="store-container">
    <div class="app-grid" id="app-grid">
      <div id="loading-state">Loading apps...</div>
    </div>
  </main>

  <script>
    let currentOsFilter = '';
    
    function setFilter(os) {
      currentOsFilter = os;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if(btn.textContent.trim() === (os || 'All')) btn.classList.add('active');
      });
      fetchApps();
    }

    async function fetchApps() {
      const grid = document.getElementById('app-grid');
      const search = document.getElementById('search-input').value.trim();
      
      grid.innerHTML = '<div id="loading-state">Searching library...</div>';
      
      try {
        const url = `backend/store/get_apps.php?os=${encodeURIComponent(currentOsFilter)}&q=${encodeURIComponent(search)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.status === 'success') {
          renderGrid(data.data);
        } else {
          grid.innerHTML = `<div id="loading-state">Error: ${data.message}</div>`;
        }
      } catch (err) {
        grid.innerHTML = '<div id="loading-state">Failed to connect to store servers.</div>';
      }
    }

    function renderGrid(apps) {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '';
      
      if (apps.length === 0) {
        grid.innerHTML = '<div id="loading-state">No applications found.</div>';
        return;
      }
      
      apps.forEach(app => {
        const sizeMb = app.file_size_bytes ? (app.file_size_bytes / (1024*1024)).toFixed(1) + ' MB' : 'Online';
        
        // Output card linking to dedicated details page
        const card = document.createElement('a');
        card.href = `app-details.html?app=${app.slug}`;
        card.className = 'app-card';
        card.innerHTML = `
          <div class="card-header">
            <img src="${app.icon_url || 'logo.png'}" class="app-icon" alt="${app.name} Icon" loading="lazy">
            <div class="app-title-group">
              <div class="app-title">${app.name}</div>
              <div class="app-dev">${app.developer}</div>
            </div>
          </div>
          <div class="card-body">
            ${app.short_description || 'No description available.'}
          </div>
          <div class="card-meta">
            <span class="badge-os">${app.os}</span>
            <span>★ ${parseFloat(app.avg_rating).toFixed(1)}</span>
          </div>
          <div class="download-action">
            <span class="version-tag">v${app.version_number || '1.0'}</span>
            <span style="font-size: 0.8rem; color: #94a3b8;">↓ ${(app.downloads_count / 1000).toFixed(1)}k</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Live search debounce
    let timeout;
    document.getElementById('search-input').addEventListener('input', () => {
      clearTimeout(timeout);
      timeout = setTimeout(fetchApps, 400);
    });

    // Init
    fetchApps();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Profile | HarshGuruJi</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f172a;
      --color-surface: rgba(30, 41, 59, 0.7);
      --color-border: rgba(255, 255, 255, 0.1);
      --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-primary: #ff3366;
      --font-sans: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body { background: var(--color-bg); color: var(--color-text-main); min-height: 100vh; padding: 2rem; display: flex; justify-content: center; }
    
    .dashboard {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 2rem;
    }
    .card {
      background: var(--color-surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 2rem;
    }
    
    .profile-sidebar { text-align: center; }
    .profile-pic-container {
      width: 150px; height: 150px; border-radius: 50%; overflow: hidden; margin: 0 auto 1.5rem;
      border: 4px solid var(--color-border);
      background: #1e293b;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }
    
    .user-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .username-tag { color: var(--color-primary); font-size: 0.9rem; margin-bottom: 1.5rem; font-weight: 500; }
    
    .btn { width: 100%; padding: 0.8rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; margin-bottom: 0.8rem; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, var(--color-primary), #7c3aed); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-main); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem;}
    .info-item { display: flex; flex-direction: column; gap: 0.4rem; }
    .info-label { font-size: 0.8rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .info-value { font-size: 1.05rem; font-weight: 500; }
    .badge { display: inline-block; padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(16, 185, 129, 0.1); color: #10b981; }

    @media(max-width: 768px) {
      .dashboard { grid-template-columns: 1fr; }
    }
  </style>
  <meta name="algolia-site-verification" content="DDB1E9756D46C4F7" />
</head>
<body>

  <div class="dashboard">
    <!-- Sidebar -->
    <div class="card profile-sidebar">
      <div class="profile-pic-container">
        <img src="logo.png" alt="Profile" id="profile-img">
      </div>
      <h2 class="user-name" id="display-name">Loading...</h2>
      <p class="username-tag" id="username">@loading</p>
      
      <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp" style="display:none">
      <button class="btn btn-primary" id="btn-upload">Upload Picture</button>
      <button class="btn btn-outline" id="btn-edit" onclick="alert('Profile Edit API ready in backend/user/profile.php via POST')">Edit Profile</button>
      <button class="btn btn-outline" id="btn-security" onclick="alert('Change Password API ready in backend/auth/security.php')">Security Settings</button>
      <a href="admin.html" id="admin-link" style="display:none"><button class="btn btn-warning" style="background:rgba(245, 158, 11, 0.1); color:#f59e0b; border:1px solid #f59e0b;">Admin Dashboard</button></a>
      <button class="btn btn-danger" id="btn-logout" style="margin-top: 1rem;">Log Out</button>
    </div>

    <!-- Main Content -->
    <div class="card">
      <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem;">Account Details</h3>
      
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Email Address</span>
          <span class="info-value" id="val-email">...</span>
        </div>
        <div class="info-item">
          <span class="info-label">Mobile</span>
          <span class="info-value" id="val-mobile">...</span>
        </div>
        <div class="info-item">
          <span class="info-label">Gender</span>
          <span class="info-value" id="val-gender">...</span>
        </div>
        <div class="info-item">
          <span class="info-label">Location</span>
          <span class="info-value" id="val-location">...</span>
        </div>
        <div class="info-item">
          <span class="info-label">Role</span>
          <span class="info-value"><span class="badge" id="val-role">User</span></span>
        </div>
        <div class="info-item">
          <span class="info-label">Join Date</span>
          <span class="info-value" id="val-join">...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Fetch Profile
    async function loadProfile() {
      try {
        const res = await fetch('backend/user/profile.php');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        
        const result = await res.json();
        if (result.status === 'success') {
          const user = result.data;
          document.getElementById('display-name').textContent = user.full_name;
          document.getElementById('username').textContent = '@' + user.username;
          document.getElementById('val-email').textContent = user.email;
          document.getElementById('val-mobile').textContent = user.mobile || 'Not set';
          document.getElementById('val-gender').textContent = user.gender;
          document.getElementById('val-location').textContent = (user.state || '') + (user.state && user.country ? ', ' : '') + (user.country || 'Not set');
          document.getElementById('val-role').textContent = user.role;
          
          if (user.role === 'Admin') {
            document.getElementById('admin-link').style.display = 'inline-block';
          }
          if (user.profile_picture) {
             document.getElementById('profile-img').src = user.profile_picture;
          }

          if (user.registration_date) {
            const date = new Date(user.registration_date.replace(' ', 'T'));
            document.getElementById('val-join').textContent = date.toLocaleDateString();
          }
        } else {
          alert('Failed to load profile');
        }
      } catch (e) {
        console.error("Error:", e);
      }
    }

    loadProfile();

    // Image Upload
    const uploadBtn = document.getElementById('btn-upload');
    const fileInput = document.getElementById('image-upload');
    const profileImg = document.getElementById('profile-img');

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      if (!fileInput.files.length) return;
      
      const file = fileInput.files[0];
      if (file.size > 2 * 1024 * 1024) {
        alert('File size exceeds 2MB limit.');
        return;
      }
      
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';
      
      const formData = new FormData();
      formData.append('profile_image', file);
      
      try {
        const res = await fetch('backend/user/upload.php', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.status === 'success') {
           profileImg.src = data.data.profile_picture + '?t=' + new Date().getTime();
        } else {
           alert(data.message);
        }
      } catch (err) {
        alert('Failed to upload image.');
      }
      
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload Picture';
      fileInput.value = '';
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      if(!confirm('Are you sure you want to log out?')) return;
      try {
        const res = await fetch('backend/auth/logout.php', { method: 'POST' });
        const data = await res.json();
        if (data.status === 'success') {
          window.location.href = data.data.redirect || 'login.html';
        }
      } catch(e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>

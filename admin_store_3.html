<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 3: Logo | Store Wizard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 2rem 0; }
    .card { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; width: 100%; max-width: 500px; text-align: center; }
    h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
    input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; }
    input:focus { border-color: #ff3366; }
    
    .preview-box { width: 100px; height: 100px; border-radius: 20px; background: #1e293b; margin: 0 auto 1.5rem; border: 2px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    
    .btn { padding: 1rem 2rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff3366, #7c3aed); color: white; font-weight: 700; cursor: pointer; width: 100%; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .steps { margin-bottom: 2rem; display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
    .step.active { color: #ff3366; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="steps">
      <span class="step">1. Upload</span>
      <span class="step">2. Info</span>
      <span class="step active">3. Logo</span>
      <span class="step">4. Publish</span>
    </div>
    
    <h1>App Logo</h1>
    <p>Paste a direct URL to the application's logo.</p>
    
    <div class="preview-box">
      <span id="placeholder-text" style="color:#94a3b8; font-size: 0.8rem;">Preview</span>
      <img id="logo-preview" src="" alt="Logo Preview">
    </div>
    
    <form id="step3-form">
      <div class="form-group">
        <label>Logo Image URL (PNG/WEBP)</label>
        <input type="url" id="logo-url" placeholder="https://example.com/icon.png" required>
      </div>
      
      <button type="submit" class="btn">Next Step →</button>
    </form>
  </div>

  <script>
    if(!sessionStorage.getItem('wizard_slug')) {
      window.location.href = 'admin_store_2.html';
    }

    const input = document.getElementById('logo-url');
    const preview = document.getElementById('logo-preview');
    const placeholder = document.getElementById('placeholder-text');

    input.addEventListener('input', () => {
      if(input.value) {
        preview.src = input.value;
        preview.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        preview.style.display = 'none';
        placeholder.style.display = 'block';
      }
    });

    document.getElementById('step3-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('wizard_icon', input.value);
      window.location.href = 'admin_store_4.html';
    });
  </script>
</body>
</html>

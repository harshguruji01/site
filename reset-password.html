<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | HarshGuruJi</title>
  <meta name="description" content="Set a new password for your HarshGuruJi account.">
  <link rel="canonical" href="https://www.webguruji.online/reset-password.html">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="navbar-premium.css">
  <link rel="stylesheet" href="footer-premium.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Enter your new secure password below.</p>
      </div>

      <div id="error-message" class="auth-alert auth-alert-error" style="display: none;"></div>
      <div id="success-message" class="auth-alert auth-alert-success" style="display: none; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 0.8rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

      <form id="new-password-form" class="auth-form">
        <div class="form-group">
          <label for="new-password" class="form-label">New Password</label>
          <input type="password" id="new-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="update-btn">
          <span>Update Password</span>
          <div class="spinner" id="update-spinner" style="display: none;"></div>
        </button>
      </form>

      <p class="auth-footer-text">
        <a href="login.html">Back to Login</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { updatePassword } from './js/auth.js';

    const form = document.getElementById('new-password-form');
    const updateBtn = document.getElementById('update-btn');
    const updateSpinner = document.getElementById('update-spinner');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
    }

    function showSuccess(message) {
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function setLoading(isLoading) {
      const btnSpan = updateBtn.querySelector('span');
      if (isLoading) {
        updateBtn.disabled = true;
        btnSpan.style.display = 'none';
        updateSpinner.style.display = 'inline-block';
      } else {
        updateBtn.disabled = false;
        btnSpan.style.display = 'inline-block';
        updateSpinner.style.display = 'none';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;

      if (p1.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      if (p1 !== p2) {
        showError('Passwords do not match.');
        return;
      }

      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        await updatePassword(p1);
        showSuccess('Password updated successfully! Redirecting to login...');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        console.error('Password update error:', err);
        showError(err.message || 'Failed to update password. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>

  <script src="navbar-premium.js"></script>
  <script src="footer-premium.js"></script>
</body>
</html>

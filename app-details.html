<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Details | HarshGuruJi Premium</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-bg: #0f172a; --color-surface: rgba(30, 41, 59, 0.6);
      --color-border: rgba(255, 255, 255, 0.1); --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8; --color-primary: #ff3366;
      --color-secondary: #7c3aed; --font-sans: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body { background: var(--color-bg); color: var(--color-text-main); }
    
    .banner { width: 100%; height: 300px; background: #1e293b; position: relative; overflow: hidden; }
    .banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: blur(5px); }
    
    .container { max-width: 1200px; margin: -100px auto 4rem; position: relative; z-index: 10; padding: 0 2rem; display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
    
    /* Main Content */
    .app-main { background: var(--color-surface); backdrop-filter: blur(20px); border: 1px solid var(--color-border); border-radius: 24px; padding: 2rem; }
    .header-row { display: flex; gap: 1.5rem; align-items: flex-end; margin-bottom: 2rem; }
    .app-icon { width: 120px; height: 120px; border-radius: 24px; background: #000; border: 4px solid var(--color-surface); object-fit: cover; }
    .app-info h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin-bottom: 0.3rem; line-height: 1.1; }
    .app-info .dev { color: var(--color-primary); font-weight: 600; font-size: 1.1rem; }
    
    .tags { margin-bottom: 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tag { background: rgba(255,255,255,0.1); padding: 0.3rem 0.8rem; border-radius: 100px; font-size: 0.8rem; }
    
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin: 2rem 0 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem; }
    .description { color: var(--color-text-muted); line-height: 1.7; font-size: 1.05rem; white-space: pre-line;}
    
    .screenshots { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; }
    .screenshots img { height: 250px; border-radius: 12px; object-fit: cover; border: 1px solid var(--color-border); }
    
    /* Sidebar */
    .sidebar { position: sticky; top: 2rem; height: fit-content; display: flex; flex-direction: column; gap: 1.5rem; }
    .download-card { background: var(--color-surface); backdrop-filter: blur(20px); border: 1px solid var(--color-border); border-radius: 24px; padding: 2rem; text-align: center; }
    
    .btn-download { display: block; width: 100%; padding: 1.2rem; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); border: none; border-radius: 16px; color: white; font-size: 1.2rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 20px rgba(255, 51, 102, 0.3); margin-bottom: 1rem; }
    .btn-download:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 51, 102, 0.4); }
    
    .btn-outline { display: block; width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--color-border); border-radius: 12px; color: white; font-weight: 600; cursor: pointer; text-decoration: none; margin-bottom: 0.5rem; }
    
    .tech-specs { text-align: left; margin-top: 1.5rem; border-top: 1px solid var(--color-border); padding-top: 1.5rem; }
    .spec-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.9rem; }
    .spec-label { color: var(--color-text-muted); }
    
    @media(max-width: 900px) { .container { grid-template-columns: 1fr; } .sidebar { position: static; } }
  </style>
</head>
<body>

  <div class="banner">
    <img id="banner-img" src="" alt="Banner">
  </div>

  <main class="container">
    <div class="app-main" id="app-main">
      <div id="loading" style="padding: 2rem; text-align: center;">Loading app details...</div>
    </div>
    
    <aside class="sidebar" id="app-sidebar" style="display:none;">
      <div class="download-card">
        <h3 style="margin-bottom: 1.5rem; font-family:'Space Grotesk';">Download</h3>
        
        <a href="#" id="primary-dl" class="btn-download">Download Latest</a>
        <a href="#" id="mirror-dl" class="btn-outline" style="display:none;">Mirror Download</a>
        <a href="#" id="official-dl" class="btn-outline" target="_blank" style="display:none;">Official Store</a>
        
        <div class="tech-specs" id="tech-specs">
          <!-- Populated by JS -->
        </div>
      </div>
    </aside>
  </main>

  <script>
    async function loadApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('app');
      if(!slug) {
        document.getElementById('loading').textContent = 'Invalid App URL.';
        return;
      }
      
      try {
        const res = await fetch(`backend/store/get_app_details.php?slug=${slug}`);
        const data = await res.json();
        
        if (data.status === 'success') {
          renderApp(data.data);
        } else {
          document.getElementById('loading').textContent = data.message;
        }
      } catch(e) {
        document.getElementById('loading').textContent = 'Network error.';
      }
    }

    function renderApp(app) {
      document.title = `${app.name} - Download | HarshGuruJi`;
      if(app.banner_url) document.getElementById('banner-img').src = app.banner_url;
      
      const main = document.getElementById('app-main');
      const tagsHtml = (app.categories || []).map(c => `<span class="tag">${c.name}</span>`).join('');
      const screensHtml = (app.screenshots || []).map(img => `<img src="${img}" alt="Screenshot">`).join('');
      
      main.innerHTML = `
        <div class="header-row">
          <img src="${app.icon_url || 'logo.png'}" class="app-icon">
          <div class="app-info">
            <h1>${app.name}</h1>
            <div class="dev">${app.developer}</div>
          </div>
        </div>
        
        <div class="tags">
          <span class="tag" style="background:rgba(255,51,102,0.2); color:#ff3366;">${app.os}</span>
          <span class="tag">${app.license}</span>
          ${tagsHtml}
        </div>
        
        <h2 class="section-title">Description</h2>
        <div class="description">${app.description || app.short_description || 'No description provided.'}</div>
        
        ${app.features ? `<h2 class="section-title">Features</h2><div class="description">${app.features}</div>` : ''}
        
        ${screensHtml ? `<h2 class="section-title">Screenshots</h2><div class="screenshots">${screensHtml}</div>` : ''}
        
        ${app.changelog ? `<h2 class="section-title">What's New in v${app.version_number}</h2><div class="description">${app.changelog}</div>` : ''}
      `;
      
      // Sidebar logic
      document.getElementById('app-sidebar').style.display = 'flex';
      if(app.primary_download_url) document.getElementById('primary-dl').href = app.primary_download_url;
      else document.getElementById('primary-dl').textContent = 'Download Unavailable';
      
      if(app.mirror_download_url) {
         const m = document.getElementById('mirror-dl');
         m.href = app.mirror_download_url;
         m.style.display = 'block';
      }
      if(app.official_store_url) {
         const o = document.getElementById('official-dl');
         o.href = app.official_store_url;
         o.style.display = 'block';
      }
      
      const specs = document.getElementById('tech-specs');
      const sizeStr = app.file_size_bytes ? (app.file_size_bytes / (1024*1024)).toFixed(2) + ' MB' : 'Unknown';
      
      specs.innerHTML = `
        <div class="spec-row"><span class="spec-label">Version</span><span>${app.version_number || '1.0'}</span></div>
        <div class="spec-row"><span class="spec-label">Size</span><span>${sizeStr}</span></div>
        <div class="spec-row"><span class="spec-label">OS Req</span><span>${app.min_os_requirement || 'Any'}</span></div>
        <div class="spec-row"><span class="spec-label">Architecture</span><span>${app.architecture || 'Universal'}</span></div>
        <div class="spec-row"><span class="spec-label">Updated</span><span>${app.release_date || (app.updated_at ? app.updated_at.split(' ')[0] : 'N/A')}</span></div>
        <div class="spec-row"><span class="spec-label">Downloads</span><span>${app.downloads_count}</span></div>
        <div class="spec-row"><span class="spec-label">Rating</span><span>★ ${parseFloat(app.avg_rating).toFixed(1)} (${app.review_count} rev)</span></div>
      `;
    }
    
    loadApp();
  </script>
</body>
</html>

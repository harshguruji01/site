<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Website - Demo</title>
  
  <!-- Modern font for premium feel -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Include the CSS -->
  <link rel="stylesheet" href="choose-website.css">

  <style>
    /* Demo specific styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      min-height: 200vh; /* Simulate scrollable page */
      background-color: #f3f4f6;
      background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .demo-content {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #1f2937;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
    }
    .fake-chat {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 60px;
      height: 60px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="demo-content">
    <h1>WebGuruJi Demo Page</h1>
    <p>Scroll down to see the floating button stay in position. The floating button is placed on the bottom right so it doesn't overlap with typical chat widgets on the bottom left.</p>
    <p>Click the "Choose Website" button to see the glassmorphism modal with smooth animations.</p>
  </div>

  <!-- Fake chat widget to show it doesn't overlap -->
  <div class="fake-chat">💬</div>

  <!-- Include the JS -->
  <script src="choose-website.js" defer></script>
</body>
</html>

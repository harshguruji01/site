<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe | HarshGuruJi Games</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  <style>
    .game-container { max-width: 500px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); text-align: center; }
    .back-btn { display: inline-block; margin-bottom: 1rem; color: var(--hub-text-secondary); text-decoration: none; text-align: left; width: 100%; }
    .status { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; color: var(--hub-text-primary); }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 2rem auto; width: 300px; height: 300px; }
    .cell { background: var(--bg-color, #1a1a1a); border: 2px solid var(--hub-accent); border-radius: 8px; font-size: 3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--hub-text-primary); transition: 0.2s; }
    .cell:hover { background: rgba(59,130,246,0.1); }
    .reset-btn { background: var(--hub-accent); color: white; border: none; padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-weight: bold; font-size: 1.1rem; }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="game-container">
  <a href="../gaming-hub.html" class="back-btn">← Back to Gaming Hub</a>
  
  <h1 style="color: var(--hub-accent); margin-bottom: 0.5rem;">Tic Tac Toe</h1>
  
  <div class="status" id="status">Player X's Turn</div>
  
  <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
  </div>

  <button class="reset-btn" onclick="resetGame()">Restart Game</button>
</main>

<script>
  const cells = document.querySelectorAll('.cell');
  const statusTxt = document.getElementById('status');
  let board = ['', '', '', '', '', '', '', '', ''];
  let currentPlayer = 'X';
  let gameActive = true;

  const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
      [0, 4, 8], [2, 4, 6]             // Diagonals
  ];

  cells.forEach(cell => cell.addEventListener('click', handleCellClick));

  function handleCellClick(e) {
      const cell = e.target;
      const index = cell.getAttribute('data-index');

      if (board[index] !== '' || !gameActive) return;

      board[index] = currentPlayer;
      cell.innerText = currentPlayer;
      cell.style.color = currentPlayer === 'X' ? '#3b82f6' : '#ef4444';

      checkWin();
  }

  function checkWin() {
      let roundWon = false;
      for (let i = 0; i < winConditions.length; i++) {
          const [a, b, c] = winConditions[i];
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
              roundWon = true;
              break;
          }
      }

      if (roundWon) {
          statusTxt.innerText = `Player ${currentPlayer} Wins! 🎉`;
          if (window.saveGameScore) window.saveGameScore('Tic Tac Toe', 1, { result: 'Win', player: currentPlayer });
          gameActive = false;
          return;
      }

      if (!board.includes('')) {
          statusTxt.innerText = 'Draw! 🤝';
          if (window.saveGameScore) window.saveGameScore('Tic Tac Toe', 0, { result: 'Draw' });
          gameActive = false;
          return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusTxt.innerText = `Player ${currentPlayer}'s Turn`;
  }

  function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;
      statusTxt.innerText = `Player X's Turn`;
      cells.forEach(cell => {
          cell.innerText = '';
      });
  }
</script>

  <script type="module" src="../js/game-db-init.js"></script>
    <script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1: Upload APK | Store Wizard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; width: 100%; max-width: 500px; text-align: center; }
    h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    .upload-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 3rem; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; }
    .upload-box:hover { border-color: #ff3366; background: rgba(255,51,102,0.05); }
    input[type="file"] { display: none; }
    .btn { padding: 1rem 2rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff3366, #7c3aed); color: white; font-weight: 700; cursor: pointer; width: 100%; transition: transform 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .steps { margin-bottom: 2rem; display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
    .step.active { color: #ff3366; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="steps">
      <span class="step active">1. Upload</span>
      <span class="step">2. Info</span>
      <span class="step">3. Logo</span>
      <span class="step">4. Publish</span>
    </div>
    
    <h1>Upload APK</h1>
    <p>Select the application file (APK, EXE, ZIP) to host on your server.</p>
    
    <div class="upload-box" id="upload-box">
      Click to browse or drag file here
    </div>
    <input type="file" id="apk-file" accept=".apk,.exe,.zip">
    
    <button class="btn" id="btn-next" disabled>Next Step →</button>
  </div>

  <script>
    const box = document.getElementById('upload-box');
    const input = document.getElementById('apk-file');
    const btnNext = document.getElementById('btn-next');
    let uploadedUrl = '';

    box.addEventListener('click', () => input.click());
    
    input.addEventListener('change', async (e) => {
      if(!input.files.length) return;
      
      const file = input.files[0];
      box.textContent = 'Uploading ' + file.name + '...';
      btnNext.disabled = true;
      
      const formData = new FormData();
      formData.append('apk_file', file);
      
      try {
        const res = await fetch('backend/admin/upload_apk.php', { method: 'POST', body: formData });
        const data = await res.json();
        
        if(data.status === 'success') {
          uploadedUrl = data.data.url;
          box.textContent = 'Successfully uploaded: ' + file.name;
          box.style.borderColor = '#10b981';
          btnNext.disabled = false;
        } else {
          alert(data.message);
          box.textContent = 'Click to try again';
        }
      } catch(err) {
        alert('Upload failed.');
        box.textContent = 'Click to try again';
      }
    });

    btnNext.addEventListener('click', () => {
      sessionStorage.setItem('wizard_apk_url', uploadedUrl);
      window.location.href = 'admin_store_2.html';
    });
  </script>
</body>
</html>

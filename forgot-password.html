<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | HarshGuruJi</title>
  <meta name="description" content="Reset your HarshGuruJi account password.">
  <link rel="canonical" href="https://www.webguruji.online/forgot-password.html">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="navbar-premium.css">
  <link rel="stylesheet" href="footer-premium.css">
</head>
<body class="auth-page">

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your registered email and we'll send you a password reset link.</p>
      </div>

      <div id="error-message" class="auth-alert auth-alert-error" style="display: none;"></div>
      <div id="success-message" class="auth-alert auth-alert-success" style="display: none; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 0.8rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

      <form id="forgot-form" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="you@example.com">
        </div>

        <button type="submit" class="btn btn-primary btn-submit" id="reset-btn">
          <span>Send Reset Link</span>
          <div class="spinner" id="reset-spinner" style="display: none;"></div>
        </button>
      </form>

      <p class="auth-footer-text">
        Remember your password? <a href="login.html">Back to Login</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { resetPassword } from './js/auth.js';

    const forgotForm = document.getElementById('forgot-form');
    const resetBtn = document.getElementById('reset-btn');
    const resetSpinner = document.getElementById('reset-spinner');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
    }

    function showSuccess(message) {
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function setLoading(isLoading) {
      const btnSpan = resetBtn.querySelector('span');
      if (isLoading) {
        resetBtn.disabled = true;
        btnSpan.style.display = 'none';
        resetSpinner.style.display = 'inline-block';
      } else {
        resetBtn.disabled = false;
        btnSpan.style.display = 'inline-block';
        resetSpinner.style.display = 'none';
      }
    }

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showError('Please enter a valid email address.');
        return;
      }

      setLoading(true);
      errorMsg.style.display = 'none';

      try {
        await resetPassword(email);
        showSuccess('Password reset link sent! Please check your email inbox.');
        forgotForm.reset();
      } catch (err) {
        console.error('Password reset error:', err);
        showError(err.message || 'Failed to send reset link. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>

  <script src="navbar-premium.js"></script>
  <script src="footer-premium.js"></script>
</body>
</html>

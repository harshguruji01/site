<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4: Publish | Store Wizard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 2rem 0; }
    .card { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; width: 100%; max-width: 500px; text-align: center; }
    h1 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
    textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; }
    textarea:focus { border-color: #ff3366; }
    
    .btn { padding: 1rem 2rem; border-radius: 12px; border: none; background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: 700; cursor: pointer; width: 100%; transition: transform 0.2s; font-size: 1.1rem; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16,185,129,0.2); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    
    .steps { margin-bottom: 2rem; display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
    .step.active { color: #ff3366; font-weight: bold; }
    
    .summary-box { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 1rem; text-align: left; margin-bottom: 1.5rem; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="steps">
      <span class="step">1. Upload</span>
      <span class="step">2. Info</span>
      <span class="step">3. Logo</span>
      <span class="step active">4. Publish</span>
    </div>
    
    <h1>Ready to Publish</h1>
    <p>Add installation instructions and push to the live store.</p>
    
    <div class="summary-box">
      <strong>Publishing:</strong> <span id="sum-name"></span> (<span id="sum-os"></span>)<br>
      <strong>Developer:</strong> <span id="sum-dev"></span><br>
      <strong>File:</strong> Ready
    </div>
    
    <form id="step4-form">
      <div class="form-group">
        <label>Installation Instructions / Notes</label>
        <textarea id="instructions" rows="4" placeholder="e.g. Extract the ZIP file and run setup.exe..."></textarea>
      </div>
      
      <button type="submit" class="btn" id="btn-publish">🚀 Publish to Store</button>
    </form>
  </div>

  <script>
    if(!sessionStorage.getItem('wizard_icon')) {
      window.location.href = 'admin_store_3.html';
    }

    document.getElementById('sum-name').textContent = sessionStorage.getItem('wizard_name');
    document.getElementById('sum-os').textContent = sessionStorage.getItem('wizard_os');
    document.getElementById('sum-dev').textContent = sessionStorage.getItem('wizard_dev');

    document.getElementById('step4-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-publish');
      btn.disabled = true;
      btn.textContent = 'Publishing...';

      const formData = new FormData();
      formData.append('apk_url', sessionStorage.getItem('wizard_apk_url'));
      formData.append('slug', sessionStorage.getItem('wizard_slug'));
      formData.append('name', sessionStorage.getItem('wizard_name'));
      formData.append('developer', sessionStorage.getItem('wizard_dev'));
      formData.append('os', sessionStorage.getItem('wizard_os'));
      formData.append('short_description', sessionStorage.getItem('wizard_desc'));
      formData.append('icon_url', sessionStorage.getItem('wizard_icon'));
      formData.append('instructions', document.getElementById('instructions').value);
      
      try {
        const res = await fetch('backend/admin/add_app.php', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.status === 'success') {
          alert('Successfully Published!');
          sessionStorage.clear();
          window.location.href = 'store.html';
        } else {
          alert('Error: ' + data.message);
          btn.disabled = false;
          btn.textContent = '🚀 Publish to Store';
        }
      } catch (err) {
        alert('Network Error.');
        btn.disabled = false;
        btn.textContent = '🚀 Publish to Store';
      }
    });
  </script>
</body>
</html>

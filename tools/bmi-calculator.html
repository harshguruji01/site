<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Body Mass Index (BMI) Calculator</h1>
    <p>Check your BMI category according to standard World Health Organization criteria.</p>
  </div>

  <div class="calc-form">
    <div class="input-group">
      <label for="bmi-weight">Weight (kg)</label>
      <input type="number" id="bmi-weight" placeholder="e.g. 70" min="1" max="400" step="0.1">
    </div>
    <div class="input-group">
      <label for="bmi-height">Height (cm)</label>
      <input type="number" id="bmi-height" placeholder="e.g. 175" min="30" max="300" step="0.5">
    </div>
  </div>

  <div class="calc-actions">
    <button id="calc-btn" class="calc-btn">Calculate BMI</button>
    <button id="reset-btn" class="reset-btn">Reset</button>
  </div>

  <div class="result-card" id="result-card">
    <div style="color: var(--hub-text-secondary, #94a3b8); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Your BMI Score</div>
    <div class="bmi-number" id="bmi-score">--</div>
    <div class="bmi-category" id="bmi-category" style="background: rgba(255,255,255,0.08); color: var(--hub-text-secondary, #94a3b8);">Enter values above</div>
    <div class="bmi-scale">
      <div class="bmi-seg" style="background: #38bdf8;" title="Underweight (&lt; 18.5)"></div>
      <div class="bmi-seg" style="background: #22c55e;" title="Normal (18.5 - 24.9)"></div>
      <div class="bmi-seg" style="background: #f59e0b;" title="Overweight (25 - 29.9)"></div>
      <div class="bmi-seg" style="background: #ef4444;" title="Obese (30+)"></div>
    </div>
    <div class="bmi-labels">
      <span>Underweight (&lt;18.5)</span>
      <span>Normal (18.5-24.9)</span>
      <span>Overweight (25-29.9)</span>
      <span>Obese (30+)</span>
    </div>
  </div>
</main>

<script>
  const weightInput = document.getElementById('bmi-weight');
  const heightInput = document.getElementById('bmi-height');
  const calcBtn = document.getElementById('calc-btn');
  const resetBtn = document.getElementById('reset-btn');
  const scoreEl = document.getElementById('bmi-score');
  const catEl = document.getElementById('bmi-category');

  function calculate() {
    const w = parseFloat(weightInput.value);
    const h = parseFloat(heightInput.value);
    if (!w || !h || w <= 0 || h <= 0) {
      scoreEl.textContent = '--';
      catEl.textContent = 'Please enter valid positive numbers';
      catEl.style.background = 'rgba(239, 68, 68, 0.15)';
      catEl.style.color = '#ef4444';
      return;
    }
    const hM = h / 100;
    const bmi = (w / (hM * hM)).toFixed(1);
    scoreEl.textContent = bmi;
    
    if (bmi < 18.5) {
      catEl.textContent = 'Underweight';
      catEl.style.background = 'rgba(56, 189, 248, 0.15)';
      catEl.style.color = '#38bdf8';
    } else if (bmi <= 24.9) {
      catEl.textContent = 'Normal Weight';
      catEl.style.background = 'rgba(34, 197, 94, 0.15)';
      catEl.style.color = '#22c55e';
    } else if (bmi <= 29.9) {
      catEl.textContent = 'Overweight';
      catEl.style.background = 'rgba(245, 158, 11, 0.15)';
      catEl.style.color = '#f59e0b';
    } else {
      catEl.textContent = 'Obese';
      catEl.style.background = 'rgba(239, 68, 68, 0.15)';
      catEl.style.color = '#ef4444';
    }
  }

  calcBtn.addEventListener('click', calculate);
  weightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
  heightInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
  resetBtn.addEventListener('click', () => {
    weightInput.value = '';
    heightInput.value = '';
    scoreEl.textContent = '--';
    catEl.textContent = 'Enter values above';
    catEl.style.background = 'rgba(255,255,255,0.08)';
    catEl.style.color = 'var(--hub-text-secondary, #94a3b8)';
  });
</script>

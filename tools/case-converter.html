<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Converter | HarshGuruJi</title>
  <meta name="description" content="Free online text case converter. Convert to UPPERCASE, lowercase, Title Case, etc.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  
  <style>
    .tool-container { max-width: 800px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); }
    .tool-header { margin-bottom: 2rem; text-align: center; }
    .tool-header h1 { margin-bottom: 0.5rem; }
    .tool-header p { color: var(--hub-text-secondary); }
    textarea { width: 100%; height: 300px; padding: 1rem; border-radius: 8px; border: 1px solid var(--hub-border); background: var(--bg-color, #1a1a1a); color: var(--hub-text-primary); font-family: inherit; font-size: 1rem; resize: vertical; transition: border-color 0.2s; margin-bottom: 1rem; }
    textarea:focus { outline: none; border-color: var(--hub-accent); }
    .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 1rem; }
    .actions { display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end; border-top: 1px solid var(--hub-border); padding-top: 1rem; }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Case Converter</h1>
    <p>Convert your text to uppercase, lowercase, title case, or sentence case.</p>
  </div>

  <div class="controls">
    <button class="hub-btn primary" onclick="convertCase('upper')">UPPERCASE</button>
    <button class="hub-btn primary" onclick="convertCase('lower')">lowercase</button>
    <button class="hub-btn primary" onclick="convertCase('title')">Title Case</button>
    <button class="hub-btn primary" onclick="convertCase('sentence')">Sentence case</button>
    <button class="hub-btn primary" onclick="convertCase('camel')">camelCase</button>
  </div>

  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
  
  <div class="actions">
    <button id="clearBtn" class="hub-btn" style="background: transparent; border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Clear Text</button>
    <button id="copyBtn" class="hub-btn" style="background: var(--hub-surface); border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Copy Text</button>
  </div>
</main>

<script>
  const textInput = document.getElementById('textInput');
  const copyBtn = document.getElementById('copyBtn');

  function convertCase(type) {
    let text = textInput.value;
    if (!text) return;

    switch(type) {
      case 'upper':
        text = text.toUpperCase();
        break;
      case 'lower':
        text = text.toLowerCase();
        break;
      case 'title':
        text = text.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        break;
      case 'sentence':
        text = text.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
        break;
      case 'camel':
        text = text.replace(/(?:^\w|[A-Z]|\b\w|\s+)/g, (match, index) => {
            if (+match === 0) return ""; 
            return index === 0 ? match.toLowerCase() : match.toUpperCase();
        });
        break;
    }
    textInput.value = text;
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    textInput.value = '';
  });

  copyBtn.addEventListener('click', () => {
    if (textInput.value) {
      navigator.clipboard.writeText(textInput.value).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
      });
    }
  });
</script>

<script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

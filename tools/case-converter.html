<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Case Converter</h1>
    <p>Convert your text to uppercase, lowercase, title case, or sentence case.</p>
  </div>

  <div class="controls">
    <button class="hub-btn primary" onclick="convertCase('upper')">UPPERCASE</button>
    <button class="hub-btn primary" onclick="convertCase('lower')">lowercase</button>
    <button class="hub-btn primary" onclick="convertCase('title')">Title Case</button>
    <button class="hub-btn primary" onclick="convertCase('sentence')">Sentence case</button>
    <button class="hub-btn primary" onclick="convertCase('camel')">camelCase</button>
  </div>

  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
  
  <div class="actions">
    <button id="clearBtn" class="hub-btn" style="background: transparent; border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Clear Text</button>
    <button id="copyBtn" class="hub-btn" style="background: var(--hub-surface); border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Copy Text</button>
  </div>
</main>

<script>
  const textInput = document.getElementById('textInput');
  const copyBtn = document.getElementById('copyBtn');

  function convertCase(type) {
    let text = textInput.value;
    if (!text) return;

    switch(type) {
      case 'upper':
        text = text.toUpperCase();
        break;
      case 'lower':
        text = text.toLowerCase();
        break;
      case 'title':
        text = text.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        break;
      case 'sentence':
        text = text.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
        break;
      case 'camel':
        text = text.replace(/(?:^\w|[A-Z]|\b\w|\s+)/g, (match, index) => {
            if (+match === 0) return ""; 
            return index === 0 ? match.toLowerCase() : match.toUpperCase();
        });
        break;
    }
    textInput.value = text;
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    textInput.value = '';
  });

  copyBtn.addEventListener('click', () => {
    if (textInput.value) {
      navigator.clipboard.writeText(textInput.value).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
      });
    }
  });
</script>

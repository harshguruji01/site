<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Percentage Calculator</h1>
    <p>Fast calculations for common percentage, discount, and proportion problems.</p>
  </div>

  <!-- Row 1: What is X% of Y? -->
  <div class="calc-row">
    <div class="calc-row-inputs">
      <span>What is</span>
      <input type="number" id="p1-x" class="calc-input" placeholder="e.g. 15">
      <span>% of</span>
      <input type="number" id="p1-y" class="calc-input" placeholder="e.g. 200">
      <span>?</span>
    </div>
    <div style="display:flex; align-items:center; gap: 0.75rem;">
      <button class="calc-btn-sm" onclick="calc1()">Calculate</button>
      <div id="p1-res" class="calc-res-badge">--</div>
    </div>
  </div>

  <!-- Row 2: X is what percent of Y? -->
  <div class="calc-row">
    <div class="calc-row-inputs">
      <input type="number" id="p2-x" class="calc-input" placeholder="e.g. 30">
      <span>is what percent of</span>
      <input type="number" id="p2-y" class="calc-input" placeholder="e.g. 150">
      <span>?</span>
    </div>
    <div style="display:flex; align-items:center; gap: 0.75rem;">
      <button class="calc-btn-sm" onclick="calc2()">Calculate</button>
      <div id="p2-res" class="calc-res-badge">--</div>
    </div>
  </div>

  <!-- Row 3: Percentage increase/decrease from X to Y -->
  <div class="calc-row">
    <div class="calc-row-inputs">
      <span>Change from</span>
      <input type="number" id="p3-x" class="calc-input" placeholder="e.g. 80">
      <span>to</span>
      <input type="number" id="p3-y" class="calc-input" placeholder="e.g. 100">
      <span>?</span>
    </div>
    <div style="display:flex; align-items:center; gap: 0.75rem;">
      <button class="calc-btn-sm" onclick="calc3()">Calculate</button>
      <div id="p3-res" class="calc-res-badge">--</div>
    </div>
  </div>
</main>

<script>
  function calc1() {
    const x = parseFloat(document.getElementById('p1-x').value);
    const y = parseFloat(document.getElementById('p1-y').value);
    const res = document.getElementById('p1-res');
    if (isNaN(x) || isNaN(y)) { res.textContent = '--'; return; }
    res.textContent = ((x / 100) * y).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function calc2() {
    const x = parseFloat(document.getElementById('p2-x').value);
    const y = parseFloat(document.getElementById('p2-y').value);
    const res = document.getElementById('p2-res');
    if (isNaN(x) || isNaN(y) || y === 0) { res.textContent = '--'; return; }
    res.textContent = ((x / y) * 100).toFixed(2) + '%';
  }

  function calc3() {
    const x = parseFloat(document.getElementById('p3-x').value);
    const y = parseFloat(document.getElementById('p3-y').value);
    const res = document.getElementById('p3-res');
    if (isNaN(x) || isNaN(y) || x === 0) { res.textContent = '--'; return; }
    const diff = ((y - x) / x) * 100;
    const sign = diff > 0 ? '+' : '';
    res.textContent = sign + diff.toFixed(2) + '%';
  }
</script>

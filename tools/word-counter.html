<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word & Character Counter | HarshGuruJi</title>
  <meta name="description" content="Free online word counter, character counter, and text analysis tool.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  
  <style>
    .tool-container { max-width: 800px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); }
    .tool-header { margin-bottom: 2rem; text-align: center; }
    .tool-header h1 { margin-bottom: 0.5rem; }
    .tool-header p { color: var(--hub-text-secondary); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-box { background: var(--bg-color, #1a1a1a); padding: 1.5rem 1rem; border-radius: 8px; text-align: center; border: 1px solid var(--hub-border); }
    .stat-value { font-size: 2rem; font-weight: bold; color: var(--hub-accent); margin-bottom: 0.25rem; }
    .stat-label { font-size: 0.85rem; color: var(--hub-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    textarea { width: 100%; height: 300px; padding: 1rem; border-radius: 8px; border: 1px solid var(--hub-border); background: var(--bg-color, #1a1a1a); color: var(--hub-text-primary); font-family: inherit; font-size: 1rem; resize: vertical; transition: border-color 0.2s; }
    textarea:focus { outline: none; border-color: var(--hub-accent); }
    .actions { display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end; }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Word & Character Counter</h1>
    <p>Instantly count words, characters, sentences, and paragraphs in your text.</p>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-value" id="wordCount">0</div>
      <div class="stat-label">Words</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="charCount">0</div>
      <div class="stat-label">Characters</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="sentenceCount">0</div>
      <div class="stat-label">Sentences</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="paragraphCount">0</div>
      <div class="stat-label">Paragraphs</div>
    </div>
  </div>

  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
  
  <div class="actions">
    <button id="clearBtn" class="hub-btn" style="background: transparent; border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Clear Text</button>
    <button id="copyBtn" class="hub-btn primary">Copy Text</button>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const textInput = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const sentenceCount = document.getElementById('sentenceCount');
    const paragraphCount = document.getElementById('paragraphCount');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    function updateStats() {
      const text = textInput.value;
      
      // Characters
      charCount.textContent = text.length;

      // Words
      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      wordCount.textContent = words.length;

      // Sentences
      const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
      sentenceCount.textContent = text.length > 0 ? sentences.length : 0;

      // Paragraphs
      const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
      paragraphCount.textContent = text.length > 0 ? paragraphs.length : 0;
    }

    textInput.addEventListener('input', updateStats);

    clearBtn.addEventListener('click', () => {
      textInput.value = '';
      updateStats();
    });

    copyBtn.addEventListener('click', () => {
      if (textInput.value) {
        navigator.clipboard.writeText(textInput.value).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
        });
      }
    });
  });
</script>

<script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

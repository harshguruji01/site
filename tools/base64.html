<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder/Decoder | HarshGuruJi</title>
  <meta name="description" content="Free online Base64 encoder and decoder tool.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  
  <style>
    .tool-container { max-width: 1000px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); }
    .tool-header { margin-bottom: 2rem; text-align: center; }
    .tool-header h1 { margin-bottom: 0.5rem; }
    .tool-header p { color: var(--hub-text-secondary); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    textarea { width: 100%; height: 250px; padding: 1rem; border-radius: 8px; border: 1px solid var(--hub-border); background: var(--bg-color, #1a1a1a); color: var(--hub-text-primary); font-family: monospace; font-size: 0.95rem; resize: vertical; transition: border-color 0.2s; }
    textarea:focus { outline: none; border-color: var(--hub-accent); }
    .actions { display: flex; gap: 1rem; justify-content: center; }
    .error-msg { color: #ef4444; margin-top: 1rem; text-align: center; display: none; padding: 0.5rem; background: rgba(239, 68, 68, 0.1); border-radius: 4px; }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Base64 Encoder & Decoder</h1>
    <p>Encode text to Base64 or decode Base64 to text instantly.</p>
  </div>

  <div class="grid">
    <div>
        <label style="display:block; margin-bottom:0.5rem; color:var(--hub-text-secondary); font-weight: 500;">Plain Text</label>
        <textarea id="textInput" placeholder="Enter text here to encode..."></textarea>
    </div>
    <div>
        <label style="display:block; margin-bottom:0.5rem; color:var(--hub-text-secondary); font-weight: 500;">Base64 Format</label>
        <textarea id="base64Input" placeholder="Enter Base64 here to decode..."></textarea>
    </div>
  </div>
  
  <div id="errorMsg" class="error-msg"></div>

  <div class="actions">
    <button id="encodeBtn" class="hub-btn primary">Encode Text ➔</button>
    <button id="decodeBtn" class="hub-btn primary">Decode Base64 ⬅</button>
    <button id="clearBtn" class="hub-btn" style="background: transparent; border: 1px solid var(--hub-border); color: #ef4444;">Clear</button>
  </div>

</main>

<script>
  const textInput = document.getElementById('textInput');
  const base64Input = document.getElementById('base64Input');
  const encodeBtn = document.getElementById('encodeBtn');
  const decodeBtn = document.getElementById('decodeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const errorMsg = document.getElementById('errorMsg');

  // utf8 to b64 robust
  function utf8_to_b64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }

  // b64 to utf8 robust
  function b64_to_utf8(str) {
    return decodeURIComponent(escape(window.atob(str)));
  }

  encodeBtn.addEventListener('click', () => {
    errorMsg.style.display = 'none';
    const text = textInput.value;
    if (!text) return;
    try {
      base64Input.value = utf8_to_b64(text);
    } catch (e) {
      errorMsg.textContent = 'Encoding Error: ' + e.message;
      errorMsg.style.display = 'block';
    }
  });

  decodeBtn.addEventListener('click', () => {
    errorMsg.style.display = 'none';
    const b64 = base64Input.value.trim();
    if (!b64) return;
    try {
      textInput.value = b64_to_utf8(b64);
    } catch (e) {
      errorMsg.textContent = 'Invalid Base64 string';
      errorMsg.style.display = 'block';
    }
  });

  clearBtn.addEventListener('click', () => {
    textInput.value = '';
    base64Input.value = '';
    errorMsg.style.display = 'none';
  });
</script>

<script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator | HarshGuruJi</title>
  <meta name="description" content="Free online JSON formatter, beautifier, and validator tool.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  
  <style>
    .tool-container { max-width: 1000px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); }
    .tool-header { margin-bottom: 2rem; text-align: center; }
    .tool-header h1 { margin-bottom: 0.5rem; }
    .tool-header p { color: var(--hub-text-secondary); }
    .json-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .json-grid { grid-template-columns: 1fr; } }
    textarea { width: 100%; height: 400px; padding: 1rem; border-radius: 8px; border: 1px solid var(--hub-border); background: var(--bg-color, #1a1a1a); color: var(--hub-text-primary); font-family: monospace; font-size: 0.9rem; resize: vertical; transition: border-color 0.2s; white-space: pre; }
    textarea:focus { outline: none; border-color: var(--hub-accent); }
    .actions { display: flex; gap: 1rem; margin-top: 1rem; justify-content: center; grid-column: 1 / -1; }
    .error-msg { color: #ef4444; margin-top: 1rem; text-align: center; display: none; padding: 1rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2); }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>JSON Formatter & Validator</h1>
    <p>Format, beautify, and validate your JSON data instantly.</p>
  </div>

  <div class="json-grid">
    <div>
        <label style="display:block; margin-bottom:0.5rem; color:var(--hub-text-secondary);">Input JSON:</label>
        <textarea id="jsonInput" placeholder='{"example": "Paste your JSON here"}'></textarea>
    </div>
    <div>
        <label style="display:block; margin-bottom:0.5rem; color:var(--hub-text-secondary);">Formatted Output:</label>
        <textarea id="jsonOutput" readonly placeholder="Formatted JSON will appear here"></textarea>
    </div>
    
    <div class="actions">
        <button id="formatBtn" class="hub-btn primary">Format / Beautify</button>
        <button id="minifyBtn" class="hub-btn" style="background: var(--hub-surface); border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Minify</button>
        <button id="copyBtn" class="hub-btn" style="background: var(--hub-surface); border: 1px solid var(--hub-border); color: var(--hub-text-primary);">Copy Output</button>
        <button id="clearBtn" class="hub-btn" style="background: transparent; border: 1px solid var(--hub-border); color: #ef4444;">Clear</button>
    </div>
  </div>
  
  <div id="errorMsg" class="error-msg"></div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const formatBtn = document.getElementById('formatBtn');
    const minifyBtn = document.getElementById('minifyBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const errorMsg = document.getElementById('errorMsg');

    function processJSON(spaces) {
      errorMsg.style.display = 'none';
      const raw = jsonInput.value.trim();
      if (!raw) {
          jsonOutput.value = '';
          return;
      }
      
      try {
        const parsed = JSON.parse(raw);
        jsonOutput.value = JSON.stringify(parsed, null, spaces);
      } catch (e) {
        errorMsg.textContent = 'Invalid JSON: ' + e.message;
        errorMsg.style.display = 'block';
        jsonOutput.value = '';
      }
    }

    formatBtn.addEventListener('click', () => processJSON(2));
    minifyBtn.addEventListener('click', () => processJSON(0));

    clearBtn.addEventListener('click', () => {
      jsonInput.value = '';
      jsonOutput.value = '';
      errorMsg.style.display = 'none';
    });

    copyBtn.addEventListener('click', () => {
      if (jsonOutput.value) {
        navigator.clipboard.writeText(jsonOutput.value).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
        });
      }
    });
  });
</script>

<script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator | HarshGuruJi</title>
  <meta name="description" content="Free secure random password generator. Generate strong passwords locally in your browser.">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  
  <style>
    .tool-container { max-width: 600px; margin: 4rem auto; padding: 2rem; background: var(--hub-surface); border-radius: var(--hub-radius); border: 1px solid var(--hub-border); }
    .tool-header { margin-bottom: 2rem; text-align: center; }
    .tool-header h1 { margin-bottom: 0.5rem; }
    .tool-header p { color: var(--hub-text-secondary); }
    .pwd-display { display: flex; background: var(--bg-color, #1a1a1a); border: 1px solid var(--hub-border); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
    .pwd-display input { flex: 1; background: transparent; border: none; padding: 1rem 1.5rem; color: var(--hub-text-primary); font-size: 1.5rem; font-family: monospace; outline: none; }
    .pwd-display button { background: var(--hub-accent); border: none; padding: 0 1.5rem; color: white; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .pwd-display button:hover { opacity: 0.9; }
    .controls-group { margin-bottom: 1.5rem; }
    .controls-group label { display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--hub-text-primary); font-weight: 500; }
    input[type="range"] { width: 100%; margin-bottom: 1rem; cursor: pointer; }
    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; color: var(--hub-text-secondary); cursor: pointer; }
    .generate-btn { width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: 8px; margin-top: 1rem; }
  </style>

  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
</head>
<body class="hub-page dark-mode">

<main class="tool-container">
  <div class="tool-header">
    <h1>Password Generator</h1>
    <p>Generate secure, random passwords directly in your browser.</p>
  </div>

  <div class="pwd-display">
    <input type="text" id="passwordOutput" readonly placeholder="Click generate">
    <button id="copyBtn">Copy</button>
  </div>

  <div class="controls-group">
    <label>
      <span>Password Length</span>
      <span id="lengthDisplay">16</span>
    </label>
    <input type="range" id="lengthSlider" min="4" max="64" value="16">
  </div>

  <div class="checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" id="includeUppercase" checked>
      Uppercase (A-Z)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="includeLowercase" checked>
      Lowercase (a-z)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="includeNumbers" checked>
      Numbers (0-9)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="includeSymbols" checked>
      Symbols (!@#$)
    </label>
  </div>

  <button id="generateBtn" class="hub-btn primary generate-btn">Generate Password</button>
</main>

<script>
  const passwordOutput = document.getElementById('passwordOutput');
  const lengthSlider = document.getElementById('lengthSlider');
  const lengthDisplay = document.getElementById('lengthDisplay');
  const includeUppercase = document.getElementById('includeUppercase');
  const includeLowercase = document.getElementById('includeLowercase');
  const includeNumbers = document.getElementById('includeNumbers');
  const includeSymbols = document.getElementById('includeSymbols');
  const generateBtn = document.getElementById('generateBtn');
  const copyBtn = document.getElementById('copyBtn');

  const chars = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
  };

  lengthSlider.addEventListener('input', (e) => {
    lengthDisplay.textContent = e.target.value;
  });

  function generatePassword() {
    let charset = '';
    if (includeUppercase.checked) charset += chars.upper;
    if (includeLowercase.checked) charset += chars.lower;
    if (includeNumbers.checked) charset += chars.numbers;
    if (includeSymbols.checked) charset += chars.symbols;

    if (!charset) {
      passwordOutput.value = 'Select at least one option';
      return;
    }

    const length = parseInt(lengthSlider.value);
    let password = '';
    
    // Use crypto for secure randomness
    const randomValues = new Uint32Array(length);
    window.crypto.getRandomValues(randomValues);

    for (let i = 0; i < length; i++) {
      password += charset[randomValues[i] % charset.length];
    }

    passwordOutput.value = password;
  }

  generateBtn.addEventListener('click', generatePassword);
  
  // Generate one initially
  generatePassword();

  copyBtn.addEventListener('click', () => {
    if (passwordOutput.value && passwordOutput.value !== 'Select at least one option') {
      navigator.clipboard.writeText(passwordOutput.value).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
      });
    }
  });
</script>

<script type='module' src='../js/auth.js' defer></script>

  <script src="../navbar-premium.js"></script>
  <script src="../footer-premium.js"></script>
</body>
</html>

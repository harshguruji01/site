<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Hub | HarshGuruJi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/hubs.css">
  <meta name="algolia-site-verification" content="DDB1E9756D46C4F7">
  <!-- Algolia InstantSearch -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.1.0/themes/satellite-min.css">
  <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4.23.3/dist/algoliasearch-lite.umd.js" defer=""></script>
  <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.66.1/dist/instantsearch.production.min.js" defer=""></script>

  <link rel="stylesheet" href="navbar-premium.css">
  <link rel="stylesheet" href="footer-premium.css">
</head>
<body class="hub-page dark-mode">

<!-- Mobile Full Screen Menu -->
<main class="hub-container">
  <!-- Hero Section -->
  <section class="hub-hero">
    <h1 class="hub-title">Learning Hub</h1>
    <p class="hub-subtitle">Learn, practice and explore knowledge with HarshGuruJi.</p>
  </section>

  <!-- Search & Filters -->
  <section class="hub-search-section">
    <div class="hub-search-bar">
      <span class="hub-search-icon">??</span>
      <input type="text" id="hub-search" class="hub-search-input" placeholder="Search Learning Hub..." aria-label="Search">
      <button id="hub-search-clear" class="hub-clear-btn" aria-label="Clear Search">?</button>
    </div>
    <div class="hub-filters">
      <button class="hub-filter-btn active" data-filter="All">All</button>
      <!-- Categories injected dynamically or statically based on page -->
    </div>
  </section>

  <!-- Main Grid -->
  <section class="hub-section">
    <h2 class="hub-section-title">Explore</h2>
    <div id="hub-grid" class="hub-grid">
      <!-- Cards rendered via JS -->
    </div>
  </section>
</main>

<script src="js/hub-core.js"></script>
<script src="js/learning-hub.js"></script>
<script src="navbar.js" defer=""></script>

  <script src="navbar-premium.js" defer=""></script>  <script type="module" src="js/auth.js" defer></script>

  <script src="navbar-premium.js"></script>
  <script src="footer-premium.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Dashboard | HarshGuruJi Learning Hub</title>
  
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/hubs.css">
  <link rel="stylesheet" href="../navbar-premium.css">
  <link rel="stylesheet" href="../footer-premium.css">
  
  <style>
    .dashboard-header {
        padding: 4rem 1rem 2rem;
        background: rgba(59,130,246,0.05);
        border-bottom: 1px solid var(--hub-border);
    }
    .header-content {
        max-width: 1000px;
        margin: 0 auto;
        text-align: center;
    }
    .subject-title {
        font-size: 3rem;
        color: var(--hub-text-primary);
        margin-bottom: 0.5rem;
    }
    
    .main-content {
        max-width: 1000px;
        margin: 3rem auto;
        padding: 0 1rem;
    }
    
    .book-section {
        margin-bottom: 3rem;
        background: var(--hub-surface);
        border: 1px solid var(--hub-border);
        border-radius: 12px;
        overflow: hidden;
    }
    .book-header {
        background: rgba(59,130,246,0.1);
        padding: 1.5rem;
        border-bottom: 1px solid var(--hub-border);
    }
    .book-title {
        font-size: 1.5rem;
        color: var(--hub-accent);
        font-weight: bold;
    }
    
    .chapter-list {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .chapter-card {
        border: 1px solid var(--hub-border);
        border-radius: 8px;
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: 0.2s;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .chapter-card:hover {
        border-color: var(--hub-accent);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .chap-info h3 { margin-bottom: 0.5rem; color: var(--hub-text-primary); }
    .chap-info p { color: var(--hub-text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem; }
    
    .chap-actions {
        display: flex;
        gap: 0.5rem;
    }
    .action-btn {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-weight: bold;
        text-decoration: none;
        font-size: 0.9rem;
        transition: 0.2s;
        border: 1px solid var(--hub-border);
        color: var(--hub-text-primary);
    }
    .action-btn.study {
        background: var(--hub-accent);
        color: white;
        border-color: var(--hub-accent);
    }
    .action-btn.study:hover { background: #2563eb; }
    .action-btn:hover:not(.study) {
        border-color: var(--hub-accent);
        color: var(--hub-accent);
    }
    
    /* Breadcrumbs */
    .breadcrumbs {
        max-width: 1000px;
        margin: 1rem auto 0;
        padding: 0 1rem;
        color: var(--hub-text-secondary);
        font-size: 0.9rem;
    }
    .breadcrumbs a { color: var(--hub-accent); text-decoration: none; }
    .breadcrumbs a:hover { text-decoration: underline; }
  </style>
</head>
<body class="hub-page dark-mode">

<script src="../navbar-premium.js"></script>

<div class="breadcrumbs" id="breadcrumbs">
    <!-- Injected via JS -->
</div>

<header class="dashboard-header">
    <div class="header-content">
        <h1 class="subject-title" id="page-title">Loading...</h1>
    </div>
</header>

<main class="main-content" id="book-container">
    <p style="text-align: center; color: var(--hub-text-secondary);">Loading books and chapters...</p>
</main>

<script src="js/curriculumEngine.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if(window.CurriculumEngine) {
            window.CurriculumEngine.initSubjectDashboard();
        }
    });
</script>

<script src="../footer-premium.js"></script>
</body>
</html>

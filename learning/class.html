  <style>
    .dashboard-header {
        padding: 4rem 1rem 2rem;
        background: rgba(59,130,246,0.05);
        border-bottom: 1px solid var(--hub-border);
    }
    .header-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 2rem;
    }
    .class-title {
        font-size: 3rem;
        color: var(--hub-text-primary);
        margin-bottom: 0.5rem;
    }
    .class-subtitle {
        color: var(--hub-text-secondary);
        font-size: 1.1rem;
    }
    
    /* Progress Box */
    .progress-box {
        background: var(--hub-surface);
        border: 1px solid var(--hub-border);
        border-radius: 12px;
        padding: 1.5rem;
        min-width: 300px;
    }
    .progress-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 1rem;
        font-weight: bold;
        color: var(--hub-text-primary);
    }
    .progress-bar-bg {
        background: var(--bg-color, #222);
        height: 12px;
        border-radius: 6px;
        overflow: hidden;
    }
    .progress-bar-fill {
        height: 100%;
        background: var(--hub-accent);
        width: 0%; /* Dynamic */
        transition: width 1s ease;
    }
    
    /* Main Content */
    .main-grid {
        max-width: 1200px;
        margin: 3rem auto;
        padding: 0 1rem;
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 2rem;
    }
    
    /* Subjects */
    .section-title {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        color: var(--hub-text-primary);
        border-bottom: 2px solid var(--hub-border);
        padding-bottom: 0.5rem;
    }
    
    .subject-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1.5rem;
    }
    
    .subject-card {
        background: var(--hub-surface);
        border: 1px solid var(--hub-border);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        text-decoration: none;
        transition: 0.2s;
    }
    .subject-card:hover {
        border-color: var(--hub-accent);
        transform: translateY(-3px);
        background: rgba(59,130,246,0.05);
    }
    .subject-icon {
        font-size: 2.5rem;
    }
    .subject-name {
        font-size: 1.25rem;
        font-weight: bold;
        color: var(--hub-text-primary);
    }
    
    /* Sidebar Links */
    .quick-links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .quick-btn {
        background: var(--hub-surface);
        border: 1px solid var(--hub-border);
        color: var(--hub-text-primary);
        padding: 1rem;
        border-radius: 8px;
        text-align: left;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    .quick-btn:hover {
        border-color: var(--hub-accent);
        color: var(--hub-accent);
    }
    
    /* Breadcrumbs */
    .breadcrumbs {
        max-width: 1200px;
        margin: 1rem auto 0;
        padding: 0 1rem;
        color: var(--hub-text-secondary);
        font-size: 0.9rem;
    }
    .breadcrumbs a { color: var(--hub-accent); text-decoration: none; }
    .breadcrumbs a:hover { text-decoration: underline; }
    
    @media (max-width: 768px) {
        .main-grid { grid-template-columns: 1fr; }
    }
  </style>

<body class="hub-page dark-mode">

<!-- Breadcrumbs -->
<div class="breadcrumbs">
    <a href="../index.html">Home</a> &gt; <a href="../learning.html">Learning Hub</a> &gt; <span id="bc-class">Loading...</span>
</div>

<header class="dashboard-header">
    <div class="header-content">
        <div>
            <h1 class="class-title" id="page-title">Loading Class...</h1>
            <p class="class-subtitle" id="page-subtitle">Welcome to your dashboard.</p>
        </div>
        
        <div class="progress-box">
            <div class="progress-header">
                <span>Your Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
</header>

<main class="hub-container" style="padding: 0;">
    <div class="main-grid">
        
        <!-- Left Column: Subjects -->
        <div>
            <h2 class="section-title">Subjects</h2>
            <div class="subject-list" id="subject-list">
                <!-- Injected via JS -->
                <p style="color: var(--hub-text-secondary);">Loading subjects...</p>
            </div>
        </div>
        
        <!-- Right Column: Quick Links -->
        <div>
            <h2 class="section-title">Quick Access</h2>
            <div class="quick-links">
                <button class="quick-btn">📖 Continue Learning</button>
                <button class="quick-btn">📝 Practice</button>
                <button class="quick-btn">🎯 Tests & Quizzes</button>
                <button class="quick-btn">⭐ Bookmarks</button>
            </div>
        </div>
        
    </div>
</main>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HarshGuruJi – Kinetic Stacking Cards with Real-time Cursor & Scroll Physics</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg-dark: #070d19;
      --card-bg: #0f172a;
      --accent: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      perspective: 1200px;
    }

    /* Ambient dynamic backdrop glow */
    .ambient-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.16;
      pointer-events: none;
      transition: background 0.7s ease, transform 0.7s ease;
      z-index: 0;
    }
    .glow-top { top: -200px; left: -150px; background: #6366f1; }
    .glow-bottom { bottom: -200px; right: -150px; background: #10b981; }

    /* Top HUD / Controls */
    .hud-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(10, 16, 31, 0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pulse-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 10px #6366f1;
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.5; }
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Kinetic Stage Viewport */
    .kinetic-stage {
      position: absolute;
      inset: 60px 0 70px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      touch-action: none;
      perspective: 1400px;
    }

    /* Stack Container */
    .stack-container {
      position: relative;
      width: min(92vw, 860px);
      height: min(72vh, 480px);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* Individual Card Layer */
    .kinetic-card {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      cursor: grab;
      transform-origin: 50% 100%;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition: box-shadow 0.3s ease;
    }

    .kinetic-card:active {
      cursor: grabbing;
    }

    /* Dynamic Glare & Shine that follows cursor */
    .card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      border-radius: 28px;
      opacity: 0;
      transition: opacity 0.35s ease;
      mix-blend-mode: overlay;
    }

    .card-shade {
      position: absolute;
      inset: 0;
      background: #000;
      pointer-events: none;
      z-index: 14;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* Card Content Layout */
    .card-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1.1fr 0.9fr;
      }
    }

    /* Media Side */
    .card-media-side {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: #090e1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.4s ease;
      filter: saturate(1.1) brightness(0.95);
      pointer-events: none;
    }

    .card-media-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 60%, rgba(15, 23, 42, 0.95) 100%),
                  linear-gradient(to top, rgba(15, 23, 42, 0.8) 0%, transparent 40%);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .card-media-gradient {
        background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, transparent 60%);
      }
    }

    /* Info Side */
    .card-info-side {
      position: relative;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      z-index: 12;
    }

    @media (max-width: 768px) {
      .card-info-side {
        padding: 20px 24px;
      }
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .card-badge {
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .card-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .card-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }

    .card-bottom-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .launch-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }
    .launch-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    .card-counter {
      font-size: 12.5px;
      font-weight: 700;
      color: #64748b;
      font-family: monospace;
    }

    /* Bottom Scrubber & Physics Indicator */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(10, 16, 31, 0.7);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scrub-track {
      flex: 1;
      max-width: 380px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      margin: 0 20px;
      cursor: pointer;
      position: relative;
    }

    .scrub-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 9999px;
      transition: width 0.1s linear;
    }

    .hint-chip {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-badge {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <!-- Ambient backdrop glows -->
  <div class="ambient-glow glow-top" id="glow-top"></div>
  <div class="ambient-glow glow-bottom" id="glow-bottom"></div>

  <!-- Top HUD -->
  <header class="hud-bar">
    <div class="brand-pill">
      <span class="pulse-indicator"></span>
      <span>HarshGuruJi</span>
      <span style="opacity: 0.35;">/</span>
      <span style="color: #a5b4fc; font-weight: 600;">Kinetic Stacking Cards</span>
    </div>

    <div class="hud-actions">
      <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400">
        <span>Cursor 3D Physics:</span>
        <span class="text-emerald-400 font-semibold" id="cursor-status">Active</span>
      </div>
      <button type="button" class="hud-btn" id="btn-prev" title="Previous Card">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Prev</span>
      </button>
      <button type="button" class="hud-btn" id="btn-next" title="Next Card">
        <span>Next</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </header>

  <!-- Kinetic Stacking Stage -->
  <main class="kinetic-stage" id="kinetic-stage">
    <div class="stack-container" id="stack-container">
      <!-- Cards will be generated dynamically -->
    </div>
  </main>

  <!-- Bottom Navigation / Scrubber Bar -->
  <footer class="bottom-bar">
    <div class="hint-chip">
      <span class="hidden sm:inline">Scroll wheel or drag</span>
      <span class="key-badge">↑</span>
      <span class="key-badge">↓</span>
      <span>to stack pillars</span>
    </div>

    <div class="scrub-track" id="scrub-track" title="Click or drag to scrub">
      <div class="scrub-progress" id="scrub-progress"></div>
    </div>

    <div class="text-xs font-mono text-slate-400" id="card-counter-display">
      Card 1 / 5
    </div>
  </footer>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // DATA DEFINITIONS (5 Core HarshGuruJi Pillars)
    // ══════════════════════════════════════════════════════════════════
    const CARDS = [
      {
        id: "guru-ai",
        title: "GuruAI Answer Engine",
        subtitle: "Neural intelligence assistant powered by Gemini 2.5 Flash with deep context memory, coding assistance, and live web research.",
        tag: "Flagship AI Studio",
        category: "Artificial Intelligence",
        rating: "4.9 ★ (1,840+ Ratings)",
        bullets: ["Gemini 2.5 Flash", "Multi-turn Reasoning", "Realtime Web Search", "Code Debugger"],
        src: "../guruai-chat-assistant.webp",
        link: "https://ai.webguruji.online",
        accent: "#6366f1",
        gradient: "linear-gradient(135deg, #6366f1, #4f46e5)"
      },
      {
        id: "home-platform",
        title: "HarshGuruJi Platform",
        subtitle: "The unified digital ecosystem connecting students, developers, and creators to free tools, NCERT curriculum, apps, and games.",
        tag: "Central Platform Hub",
        category: "Complete Ecosystem",
        rating: "Official Platform",
        bullets: ["All-in-One Portal", "Zero Subscription", "Fast Cloud Network", "Secure Gate Pass"],
        src: "../harshguruji-home-cover.webp",
        link: "../index.html",
        accent: "#0ea5e9",
        gradient: "linear-gradient(135deg, #0ea5e9, #0284c7)"
      },
      {
        id: "ncert-hub",
        title: "NCERT & Education Hub",
        subtitle: "All-in-one free digital school offering complete NCERT textbooks (Classes 1–12), chapter solutions, notes, and revision quizzes.",
        tag: "Free K-12 Digital School",
        category: "CBSE & NCERT Curriculum",
        rating: "Classes 1 to 12",
        bullets: ["All School Subjects", "Chapter Solutions", "Interactive Quizzes", "Offline Downloads"],
        src: "../harshguruji-books-ncert.webp",
        link: "../learning-hub.html",
        accent: "#10b981",
        gradient: "linear-gradient(135deg, #10b981, #059669)"
      },
      {
        id: "store-apps",
        title: "Software & Store Apps",
        subtitle: "Curated repository of audited, virus-scanned Android APKs, desktop applications, and productivity tools with fast direct downloads.",
        tag: "Verified Application Vault",
        category: "Software Repository",
        rating: "Audited Binaries",
        bullets: ["Checksum Verified", "Fast Mirror Direct", "Virus Scanned", "Ad-Free Builds"],
        src: "../harshguruji-store-apps.webp",
        link: "https://store.webguruji.online",
        accent: "#f59e0b",
        gradient: "linear-gradient(135deg, #f59e0b, #d97706)"
      },
      {
        id: "community-chat",
        title: "Community Chat & Learning",
        subtitle: "Live collaborative forum for students and developers to discuss homework problems, exchange ideas, and ask questions in real time.",
        tag: "Live Collaboration Hub",
        category: "Community Network",
        rating: "Active Live Rooms",
        bullets: ["Realtime Chat", "Collaborative Study", "Coding Support", "Instant Q&A"],
        src: "../harshguruji-chat-community.webp",
        link: "https://chat.webguruji.online",
        accent: "#ec4899",
        gradient: "linear-gradient(135deg, #ec4899, #db2777)"
      }
    ];

    const N = CARDS.length;
    const stage = document.getElementById("kinetic-stage");
    const container = document.getElementById("stack-container");
    const scrubProgress = document.getElementById("scrub-progress");
    const scrubTrack = document.getElementById("scrub-track");
    const counterDisplay = document.getElementById("card-counter-display");
    const glowTop = document.getElementById("glow-top");
    const glowBottom = document.getElementById("glow-bottom");

    // Build DOM elements for each card
    const cardElements = [];
    CARDS.forEach((card, i) => {
      const el = document.createElement("div");
      el.className = "kinetic-card";
      el.id = `card-${i}`;
      el.dataset.index = i;
      el.innerHTML = `
        <div class="card-glare" id="glare-${i}"></div>
        <div class="card-shade" id="shade-${i}"></div>
        <div class="card-grid">
          <!-- Media Side -->
          <div class="card-media-side">
            <img src="${card.src}" alt="${card.title}" class="card-img" id="img-${i}" loading="eager" />
            <div class="card-media-gradient"></div>
          </div>

          <!-- Info Side -->
          <div class="card-info-side">
            <div>
              <div class="card-top-meta">
                <span class="card-tag" style="background: ${card.accent}20; color: ${card.accent}; border-color: ${card.accent}40;">${card.tag}</span>
                <span class="card-badge">${card.rating}</span>
              </div>
              <h2 class="card-title">${card.title}</h2>
              <p class="card-subtitle">${card.subtitle}</p>
              <div class="card-bullets">
                ${card.bullets.map(b => `<span class="card-pill">${b}</span>`).join("")}
              </div>
            </div>

            <div class="card-bottom-actions">
              <a href="${card.link}" target="_blank" rel="noopener noreferrer" class="launch-link" style="background: ${card.gradient};">
                <span>Explore Pillar</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
              </a>
              <span class="card-counter">0${i + 1} / 0${N}</span>
            </div>
          </div>
        </div>
      `;
      container.appendChild(el);
      cardElements.push(el);
    });

    // ══════════════════════════════════════════════════════════════════
    // KINETIC SCROLL & STACKING PHYSICS ENGINE
    // ══════════════════════════════════════════════════════════════════
    let scrollPos = 0;       // Float from 0 to N - 1
    let targetPos = 0;
    let isAnimating = false;

    // Cursor tracking state
    let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    let hasPointer = false;

    function updateCardTransforms() {
      // Interpolate cursor with smooth damping
      mouse.x += (mouse.targetX - mouse.x) * 0.12;
      mouse.y += (mouse.targetY - mouse.y) * 0.12;

      // 3D Tilt angles from cursor
      const rotY = mouse.x * 12; // deg
      const rotX = -mouse.y * 12; // deg

      // Active card index (rounded or floor)
      const activeIdx = Math.min(N - 1, Math.max(0, Math.floor(scrollPos)));
      const activeCardData = CARDS[Math.min(N - 1, Math.round(scrollPos))];

      // Update ambient glows to match active card
      if (activeCardData) {
        glowTop.style.background = activeCardData.accent;
        glowBottom.style.background = activeCardData.accent;
      }

      cardElements.forEach((el, i) => {
        const diff = scrollPos - i;
        const glare = el.querySelector(".card-glare");
        const shade = el.querySelector(".card-shade");
        const img = el.querySelector(".card-img");

        let translateY = 0;
        let scale = 1;
        let rotate = 0;
        let opacity = 1;
        let zIndex = 10;
        let shadeOpacity = 0;

        if (diff >= 0 && diff < 1) {
          // Card i is currently in active transition or being stacked upon
          // Stacking locks it at top, scales down slightly
          scale = 1 - diff * 0.08;
          translateY = diff * -18; // moves up slightly into the stack
          rotate = diff * -2;
          zIndex = 10 + i;
          shadeOpacity = diff * 0.35;
        } else if (diff >= 1) {
          // Card i is fully stacked underneath
          const stackDepth = diff;
          scale = Math.max(0.78, 1 - stackDepth * 0.08);
          translateY = Math.max(-60, stackDepth * -18);
          rotate = -stackDepth * 2;
          zIndex = 10 + i;
          shadeOpacity = Math.min(0.65, stackDepth * 0.35);
          opacity = diff > 3 ? 0 : 1;
        } else {
          // Card i is incoming from below (diff < 0)
          const arrive = -diff;
          translateY = arrive * 420; // rises from bottom
          scale = Math.max(0.9, 1 - arrive * 0.06);
          rotate = arrive * 4;
          zIndex = 20 + i;
          opacity = Math.max(0, 1 - arrive * 0.85);
          shadeOpacity = 0;
        }

        // Apply dynamic cursor tilt only to the topmost / currently active card
        if (Math.abs(diff) < 0.65) {
          const cardTiltX = rotX * (1 - Math.abs(diff));
          const cardTiltY = rotY * (1 - Math.abs(diff));
          el.style.transform = `translate3d(0, ${translateY}px, 0) scale(${scale}) rotateX(${cardTiltX}deg) rotateY(${cardTiltY}deg) rotateZ(${rotate}deg)`;
          
          // Image parallax inside active card
          if (img) {
            img.style.transform = `scale(1.08) translate3d(${mouse.x * -16}px, ${mouse.y * -16}px, 0)`;
          }

          // Cursor dynamic glare
          if (glare && hasPointer) {
            glare.style.opacity = "0.7";
            const posX = 50 + mouse.x * 40;
            const posY = 50 + mouse.y * 40;
            glare.style.background = `radial-gradient(circle 420px at ${posX}% ${posY}%, rgba(255, 255, 255, 0.28), transparent 70%)`;
          }
        } else {
          el.style.transform = `translate3d(0, ${translateY}px, 0) scale(${scale}) rotateZ(${rotate}deg)`;
          if (img) {
            img.style.transform = "scale(1) translate3d(0, 0, 0)";
          }
          if (glare) {
            glare.style.opacity = "0";
          }
        }

        el.style.zIndex = zIndex;
        el.style.opacity = String(opacity);
        el.style.visibility = opacity > 0 ? "visible" : "hidden";
        if (shade) {
          shade.style.opacity = String(shadeOpacity);
        }
      });

      // Update scrubber progress bar
      const progressFrac = Math.max(0, Math.min(1, scrollPos / (N - 1)));
      scrubProgress.style.width = `${progressFrac * 100}%`;
      counterDisplay.textContent = `Card ${Math.min(N, Math.round(scrollPos) + 1)} / ${N}`;
    }

    // Smooth ticker loop
    function tick() {
      const dt = gsap.ticker.deltaRatio(60) / 60;
      scrollPos += (targetPos - scrollPos) * (1 - Math.exp(-dt * 9));

      updateCardTransforms();

      if (Math.abs(targetPos - scrollPos) > 1e-3 || hasPointer) {
        requestAnimationFrame(tick);
      } else {
        scrollPos = targetPos;
        updateCardTransforms();
        isAnimating = false;
      }
    }

    function pushTarget(newTarget) {
      targetPos = Math.max(0, Math.min(N - 1, newTarget));
      if (!isAnimating) {
        isAnimating = true;
        requestAnimationFrame(tick);
      }
    }

    // Step by card index
    function stepCard(dir) {
      pushTarget(Math.round(targetPos) + dir);
    }

    document.getElementById("btn-prev").addEventListener("click", () => stepCard(-1));
    document.getElementById("btn-next").addEventListener("click", () => stepCard(1));

    // ══════════════════════════════════════════════════════════════════
    // CURSOR & MOUSEMOVE LISTENER (Realistic 3D Follow)
    // ══════════════════════════════════════════════════════════════════
    window.addEventListener("pointermove", (e) => {
      hasPointer = true;
      const rect = container.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      // Normalized coordinates: -1 to 1
      mouse.targetX = Math.max(-1, Math.min(1, (e.clientX - cx) / (rect.width / 2)));
      mouse.targetY = Math.max(-1, Math.min(1, (e.clientY - cy) / (rect.height / 2)));

      if (!isAnimating) {
        isAnimating = true;
        requestAnimationFrame(tick);
      }
    });

    window.addEventListener("pointerleave", () => {
      mouse.targetX = 0;
      mouse.targetY = 0;
      hasPointer = false;
    });

    // ══════════════════════════════════════════════════════════════════
    // WHEEL & SCROLL LISTENER (Chained Scroll & Inertia)
    // ══════════════════════════════════════════════════════════════════
    let wheelIdleTimer;
    window.addEventListener("wheel", (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      const deltaCard = d / 280; // 280px travel per card

      const nextTarget = targetPos + deltaCard;

      // Check boundaries for smooth chaining to parent page
      if (nextTarget < 0 && e.deltaY < 0) {
        // Scrolled above first card -> pass to parent window
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'scroll-parent', deltaY: e.deltaY }, '*');
        }
      } else if (nextTarget > N - 1 && e.deltaY > 0) {
        // Scrolled below last card -> pass to parent window
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'scroll-parent', deltaY: e.deltaY }, '*');
        }
      }

      pushTarget(nextTarget);

      clearTimeout(wheelIdleTimer);
      wheelIdleTimer = setTimeout(() => {
        // Settle on nearest whole card
        pushTarget(Math.round(targetPos));
      }, 160);
    }, { passive: true });

    // ══════════════════════════════════════════════════════════════════
    // TOUCH / POINTER DRAG PHYSICS
    // ══════════════════════════════════════════════════════════════════
    let dragData = null;
    stage.addEventListener("pointerdown", (e) => {
      if (e.target.closest("a, button")) return;
      dragData = {
        id: e.pointerId,
        startY: e.clientY,
        lastY: e.clientY,
        startPos: targetPos,
        travel: 0
      };
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener("pointermove", (e) => {
      if (!dragData || e.pointerId !== dragData.id) return;
      const dy = dragData.startY - e.clientY;
      dragData.travel += Math.abs(dragData.lastY - e.clientY);
      dragData.lastY = e.clientY;

      if (dragData.travel > 6) {
        // Drag up moves forward, drag down moves backward
        const cardH = container.clientHeight || 480;
        const change = dy / (cardH * 0.85);
        pushTarget(dragData.startPos + change);
      }
    });

    const endDrag = (e) => {
      if (!dragData || e.pointerId !== dragData.id) return;
      if (dragData.travel > 10) {
        // Snap to nearest whole card
        const dir = Math.sign(dragData.startY - e.clientY);
        const snapped = Math.round(targetPos);
        pushTarget(snapped);
      }
      dragData = null;
    };

    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    // ══════════════════════════════════════════════════════════════════
    // SCRUBBER TRACK INTERACTION
    // ══════════════════════════════════════════════════════════════════
    scrubTrack.addEventListener("click", (e) => {
      const rect = scrubTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const fraction = Math.max(0, Math.min(1, clickX / rect.width));
      pushTarget(fraction * (N - 1));
    });

    // Keyboard Arrow Keys
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        stepCard(1);
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        stepCard(-1);
      }
    });

    // Initial setup
    updateCardTransforms();
  </script>
</body>
</html>
